 blades_and_thrones_veterans.1.title: "老兵返乡"
 blades_and_thrones_veterans.1.desc: "战争结束了，号角声渐远。营地里的老兵们开始收拾行囊——有些人想回家种田，有些人除了打仗什么都不会，还有些人觉得'再打一仗'才是最好的归宿。士兵阶层望着国库，等着王室对功臣们做个了断。\n\n无论王室如何决定，遣散的士兵都将在数月内陆续回到田间——刀剑入鞘容易，让握过刀的手重新握住犁铧，却需要时间。\n当前士兵总规模：[ROOT.GetVariable('blades_and_thrones_veteran_soldier_size').GetValue|V0] 人。"
 blades_and_thrones_veterans.1.a: "发放遣散费，解甲归田"
 blades_and_thrones_veterans.1.a.tt: "支付 [ROOT.GetVariable('blades_and_thrones_veteran_severance_display').GetValue|V0] 金币作为遣散费，削减 30% 士兵 POP（解甲归田）。余下的超编士兵在 2 年内陆续失业归田（士兵期望 -10%）。士兵阶层满意度上升，稳定度微增。"
 blades_and_thrones_veterans.1.b: "欠饷遣散，任其自谋生路"
 blades_and_thrones_veterans.1.b.tt: "不支付遣散费，削减 30% 士兵 POP，余下超编士兵在 2 年内陆续失业归田。得'老兵不满'修正（3 年）：人力 -5%、士兵叛乱上升、军队忠诚承压。士兵阶层满意度下降。"
 blades_and_thrones_veterans.1.c: "保留精锐，编为常备核心"
 blades_and_thrones_veterans.1.c.tt: "不裁军，士兵 POP 保留。得'精锐老兵'修正（10 年）：陆军传统 +0.05/月、纪律 +2.5%、士气 +5%，但维护费 +5%。正统性微增。"
 blades_and_thrones_veterans.1.d: "暂不处理"
 blades_and_thrones_veterans.1.d.tt: "维持现状，把决定推迟到以后。"
 blades_and_thrones_veterans.2.title: "老兵骚动"
 blades_and_thrones_veterans.2.desc: "被拖欠遣散费的老兵们没有回乡。他们在城外的旧营地里聚成了堆，靠回忆战功和抱怨王室打发日子。酒馆里开始流传他们的话：'我们流过血，他们连铜板都舍不得。'最近，有人看见他们夜里在磨刀。"
 blades_and_thrones_veterans.2.a: "补发遣散费"
 blades_and_thrones_veterans.2.a.tt: "支付 200 金币补发遣散费，平息老兵怨气（移除'老兵不满'修正）。士兵阶层满意度上升。"
 blades_and_thrones_veterans.2.b: "派兵镇压"
 blades_and_thrones_veterans.2.b.tt: "镇压骚动（移除'老兵不满'修正），但得'老兵镇压余波'修正（2 年）：人力 -5%、士兵叛乱上升、正统 -0.01/月。稳定度轻微下降。"
 blades_and_thrones_veterans.2.c: "不予理会"
 blades_and_thrones_veterans.2.c.tt: "任其自生自灭：'老兵不满'修正延续，但省下钱与麻烦。"
 blades_and_thrones_veterans.3.title: "精锐何去何从"
 blades_and_thrones_veterans.3.desc: "和平年复一年，精锐老兵们依旧保持着操练的节奏——晨钟前的集结、风雨无阻的队列。他们是最锋利的刀，但刀锋闲置久了也会生锈。将军们问：这支百战之师，是并入常备军成为国家的脊梁，还是就此解散，让它的传说留在酒馆里？"
 blades_and_thrones_veterans.3.a: "并入常备军，制度化训练"
 blades_and_thrones_veterans.3.a.tt: "精锐老兵并入常备军（移除'精锐老兵'修正），得'精锐制度化'修正（20 年）：陆军传统 +0.03/月、纪律 +1.5%、维护效率 +3%。士兵阶层满意度上升。"
 blades_and_thrones_veterans.3.b: "保留精锐编制"
 blades_and_thrones_veterans.3.b.tt: "维持'精锐老兵'修正，两年后再议。"
 blades_and_thrones_veterans.3.c: "解散精锐"
 blades_and_thrones_veterans.3.c.tt: "解散精锐（移除'精锐老兵'修正），省下维护费，稳定度微增。"
