 mercenary_mutiny_desc: "雇佣兵兵力压过国家可控军力时，军事危机逐月累积；危机满 100 必定爆发哗变。哗变可被镇压（代价沉重），也可能演变为内战，最终按开战时军力对比决定夺舍、分裂或剿灭。"
 blades_and_thrones_military_coup_desc: "军队忠诚过低时可能发生军事政变。接受军人接管将建立军政府统治，进入长期政治博弈；镇压则损失稳定与士兵满意度。"
 blades_and_thrones_military_junta_disaster_desc: "军政府统治期间，稳定度、正统性、士兵满意度与战争形势共同决定军政府走向：制度化、还政王室、内部分裂或二次夺权。"
 blades_and_thrones_militia_autonomy: "团练自治"
 blades_and_thrones_militia_autonomy_desc: "王室默许地方军人聚众自组团练、营建营所。士兵阶层获得自主扩充兵源的组织能力，但王室对暴力的垄断也随之松动。授予后士兵阶层可在各地营建团练所；撤销后不再新建。"
 blades_and_thrones_militia_training_ground: "团练所"
 blades_and_thrones_militia_training_ground_desc: "地方军人聚众操练、自成一体的营所，壮大本地士兵阶层力量与兵源，代价是本地士兵食物消费上升。"
 blades_and_thrones_militia_training_ground_stats_tt: "#T 团练所（单级，士兵阶层营建）#!\n· 本地士兵阶层力量 +0.05\n· 本地人力修正 +5%\n· 本地征召规模 +10%\n· 本地士兵食物消费 +10%（代价）\n· 乡村/城镇/城市/大都会均可营建"
 blades_and_thrones_militia.99.title: "团练调试"
 blades_and_thrones_militia.99.desc: "团练所测试工具：一键授予/撤销团练自治，为士兵阶层注资，或在首都强制建造团练所（用于验证建筑定义、维护配方与修正显示，无需等待阶层 AI）。"
 MODIFIER_TYPE_NAME_allow_blades_and_thrones_militia_training_ground: "允许营建团练所"
 MODIFIER_TYPE_DESC_allow_blades_and_thrones_militia_training_ground: "该许可存在时，士兵阶层可在各地营建团练所；撤销许可后不再新建。"
 AUTO_MODIFIER_NAME_blades_and_thrones_era_levy_early: "征召军制·黄金时代"
 AUTO_MODIFIER_DESC_blades_and_thrones_era_levy_early: "地理大发现时代及以前，征召兵与地方民兵正值鼎盛：征召规模与人力提升，维护效率更高。"
 AUTO_MODIFIER_NAME_blades_and_thrones_era_levy_late: "征召军制·时代落后"
 AUTO_MODIFIER_DESC_blades_and_thrones_era_levy_late: "宗教改革时代起，火药与线列战术兴起，征召兵不堪一击：纪律与士气下降。"
 AUTO_MODIFIER_NAME_blades_and_thrones_era_standing_early: "常备军·时代低效"
 AUTO_MODIFIER_DESC_blades_and_thrones_era_standing_early: "地理大发现时代及以前，常备军昂贵而笨重：维护效率下降。"
 AUTO_MODIFIER_NAME_blades_and_thrones_era_standing_late: "常备军·时代强化"
 AUTO_MODIFIER_DESC_blades_and_thrones_era_standing_late: "宗教改革时代起，军事革命展开，职业常备军成为战争之王：纪律、士气与维护效率提升。"
 AUTO_MODIFIER_NAME_blades_and_thrones_era_mercenary_early: "佣兵联盟·黄金时代"
 AUTO_MODIFIER_DESC_blades_and_thrones_era_mercenary_early: "地理大发现时代及以前，佣兵正值黄金岁月：雇佣溢价更低，佣兵维护更便宜。"
 AUTO_MODIFIER_NAME_blades_and_thrones_era_mercenary_late: "佣兵联盟·式微"
 AUTO_MODIFIER_DESC_blades_and_thrones_era_mercenary_late: "宗教改革时代起，国家军队取代雇佣兵：雇佣溢价上升，可用佣兵减少。"
 AUTO_MODIFIER_NAME_blades_and_thrones_era_mixed_late: "混合军制·均衡强化"
 AUTO_MODIFIER_DESC_blades_and_thrones_era_mixed_late: "宗教改革时代起，取长补短的混合军制在军事革命中稳步受益：纪律与士气小幅提升。"
 cb_blades_and_thrones_expel_landless: "驱逐无地军团"
 cb_blades_and_thrones_expel_landless_desc: "一支无地的流浪军队正盘踞在我国领土上。他们要么离开，要么被消灭。"
 cb_blades_and_thrones_restoration: "光复故都"
 cb_blades_and_thrones_restoration_desc: "我们的故都如今沦落敌手。夺回首都，光复国家！"
 EXPEL_LANDLESS_WAR_NAME: "驱逐无地军团之战"
 RESTORATION_WAR_NAME: "光复故都之战"
 blades_and_thrones_landless.1.title: "安营扎寨：流亡的尽头"
 blades_and_thrones_landless.1.desc: "旗帜第一次插在了属于我们自己的土地上。老兵们放下行囊，望着这片即将被称为'家园'的地方——有人开始规划城墙，有人已经在琢磨来年的收成。流亡结束了，但真正的考验才刚刚开始：治理、纳税、还有那些虎视眈眈的邻居。"
 blades_and_thrones_landless.1.a.tt: "在此扎根：结束流亡身份，成为有土地的军事国家（保留军事传统）。"
 blades_and_thrones_landless.1.b.tt: "继续流浪：暂不建立根据地（土地仍在你手中，可随时决定）。"
 blades_and_thrones_landless.2.title: "刀剑与饥饿：粮尽之日"
 blades_and_thrones_landless.2.desc: "粮车已经三天没有进营了。士兵们围着空锅坐成一圈，目光在营外的农田与军法之间游移。老兵说：'刀剑可以换来粮食，但也会换来绞架。'饥肠辘辘的军团需要一个决定。"
 blades_and_thrones_landless.2.a.tt: "纵兵劫掠：获得 [ROOT.GetVariable('blades_and_thrones_plunder_display').GetValue|V0] 金币，稳定度下降，士兵阶层满意。"
 blades_and_thrones_landless.2.b.tt: "约束军纪：不劫掠，士兵阶层略为不满。"
 blades_and_thrones_landless.3.title: "还都：王座在召唤"
 blades_and_thrones_landless.3.desc: "故都的城门在面前敞开，城墙上还留着当年的弹痕。老人们认出了军团的老旗号，有人跪在路边哭泣。王座就在那里，落满灰尘，等待它的主人。流亡结束了——现在，重建国家。"
 blades_and_thrones_landless.3.a.tt: "光复故都：结束流亡身份，获得永久修正「复国者」，正统性大幅提升。"
 blades_and_thrones_grant_settlement: "赐予定居地"
 blades_and_thrones_grant_settlement_desc: "把一块领土赠予无地流亡者，让他们安家立业——获得土地后他们会自行转正，结束流亡身份。"
 blades_and_thrones_claim_foothold: "夺取立足地"
 blades_and_thrones_claim_foothold_desc: "以刀剑立国：选定一块土地——有主地（异教/异文化）立即宣战征服；无主地（如新大陆）直接占领建立据点。获得土地后即可安家转正。"
 blades_and_thrones_lease_army: "出租军团"
 blades_and_thrones_lease_army_desc: "把常备军挂牌租给外交范围内不敌对我们的国家（租期 24 个月，对方按市场价雇佣，到期自动归还）。"
