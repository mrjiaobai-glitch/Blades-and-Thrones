 blades_and_thrones_conversion.1.title: "军事转化"
 blades_and_thrones_conversion.1.desc: "王国的军事力量可以在常备军、雇佣兵、无地军团与士兵人口之间相互转化。选择一项转化；随后可在弹窗中指定目标部队、佣兵、军团或地点。\n\n本月军饷：[ROOT.GetVariable('blades_and_thrones_pay_cost_display').GetValue|V0]@gold!\n军队忠诚：[ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]\n士兵满意度：[ROOT.GetVariable('blades_and_thrones_soldier_satisfaction_display').GetValue|V0%]\n佣兵威胁：[ROOT.GetVariable('blades_and_thrones_mercenary_pressure_display').GetValue|V0%]\n军政府掌控力：[ROOT.GetVariable('blades_and_thrones_junta_stability_display').GetValue|V0]\n战争持续：[ROOT.GetVariable('blades_and_thrones_war_months_display').GetValue|V0]个月\n军事危机：[ROOT.GetVariable('blades_and_thrones_military_crisis_display').GetValue|V0]/100\n[ROOT.GetCountry.Custom('blades_and_thrones_crisis_flavor')]"
 blades_and_thrones_conversion.1.a.tt: "选择一支已雇佣的佣兵公司，整编为常备军（费用按兵力计算）。军事危机随之下降。"
 blades_and_thrones_conversion.1.b.tt: "选择一支常备军，组建为无地军团国（你的附属国），随后选择忠诚或放任自立。"
 blades_and_thrones_conversion.1.c.tt: "收编军团：外派军团免费归队；夺舍灾变和解自立的军团需赎买（按兵力付费，每千人 100 金）——一次性买断其雇佣合同。"
 blades_and_thrones_conversion.1.d.tt: "选择一支常备军，解散为士兵人口（增强士兵阶层）。"
 mercenary_mutiny_test.1.l.tt: "打开军事转化菜单（收编佣兵/收编军团/遣散军队/退伍安置）。"
 blades_and_thrones_conversion.1.e.tt: "选择一个地点，把当地的士兵人口转业为农民（削弱士兵阶层、安抚农民阶层）。"
 blades_and_thrones_conversion.1.f.tt: "把常备军挂牌出租给外交范围内不敌对我们的国家（租期 24 个月，按市场价雇佣）。这是一项外交杠杆：租给并肩作战者会加深同盟（额外好感）；租给正在与我方敌人交战的国家可间接抑制敌国，但会招致敌方阵营反感；厌恶我们的人买不到兵。目标国会收到报价通知，租不租由对方判断。"
 blades_and_thrones_lease.1.title: "出售武力：军团出租报价"
 blades_and_thrones_lease.1.desc: "一名[from.GetName]的使节带着一份文书来到宫中：他们愿意租下你的一支军团，为期两年，价码已经写在羊皮纸上。租出去，军团自会为他们作战，军饷有人买单；不租，刀剑就留在自己手里。权衡在你。"
