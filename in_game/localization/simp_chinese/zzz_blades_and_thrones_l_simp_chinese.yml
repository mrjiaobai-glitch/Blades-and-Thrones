 ai_warlord: "军阀"
 ai_warlord_desc: "该国拥兵自重、好战成性，以地盘与兵权为第一要务，轻视稳定与外交——典型的藩镇割据性格。"
 ai_mercenary_company: "佣兵团"
 ai_mercenary_company_desc: "该国是拿钱卖命的雇佣兵集团：金钱与兵源至上，忠诚与外交都是可以标价的东西——只要有雇主付得起钱，昨天的敌人明天就能并肩作战。"
 ai_trusted_company: "代管军团"
 ai_trusted_company_desc: "该国是国家的代管军队：忠顺守纪、防御尽责，视自己为国家武装的一部分——不主动惹事，但守卫国土绝不含糊。"
