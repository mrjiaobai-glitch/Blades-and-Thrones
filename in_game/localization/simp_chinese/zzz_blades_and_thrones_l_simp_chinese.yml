 blades_and_thrones_war.2.title: "败军之师：清算与问责"
 blades_and_thrones_war.2.desc: "败军拖着残破的旗帜退回城内，城门口没有鲜花，只有沉默。军官们互相推诿，政敌们已经在酝酿弹劾的措辞。所有人都需要一个解释——或者，一个替罪羊。\n军队忠诚：[ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]。"
