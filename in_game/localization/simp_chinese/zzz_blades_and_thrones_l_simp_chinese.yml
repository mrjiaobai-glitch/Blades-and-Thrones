 STATIC_MODIFIER_NAME_mercenary_mutiny_army_country_subsidy: "雇佣津贴"
 STATIC_MODIFIER_DESC_mercenary_mutiny_army_country_subsidy: "宗主预付给低级佣兵军团的月度津贴——佣兵主要靠自己接合同与劫掠谋生。"
 STATIC_MODIFIER_NAME_mercenary_mutiny_trusted_subsidy: "军费拨款"
 STATIC_MODIFIER_DESC_mercenary_mutiny_trusted_subsidy: "王室拨给代管军团的全额军费——国家军队由国家供养。"
 STATIC_MODIFIER_NAME_mercenary_mutiny_veteran_stipend: "老兵雇佣津贴"
 STATIC_MODIFIER_DESC_mercenary_mutiny_veteran_stipend: "强力佣兵国的合同金：老兵要价更高。"
 STATIC_MODIFIER_NAME_mercenary_mutiny_grand_subsidy: "大军团军费拨款"
 STATIC_MODIFIER_DESC_mercenary_mutiny_grand_subsidy: "大型代管军团的全额军费——精锐核心的待遇。"
 mercenary_company: "佣兵自由团"
 mercenary_company_desc: "一支不拥有领土、来去自由的佣兵军团——依靠合同、劫掠与海外据点维生，名义臣属，实为无主之师。"
 mercenary_company_trusted: "代管军团"
 mercenary_company_trusted_desc: "国家军队的代管机构：听令于王室，防御必参、进攻可召；无脱离之力，亦无反叛之心。"
 mercenary_company_veteran: "强力佣兵国"
 mercenary_company_veteran_desc: "武力强大的老兵佣兵团：拥有脱离宗主的力量，也可能在宗主危难时倒戈。"
 mercenary_company_grand: "大型代管军团"
 mercenary_company_grand_desc: "国家军的精锐核心：实力与宗主持平，可和平脱离，但永不战场倒戈。"
 mercenary_company_warlord: "地方军阀"
 mercenary_company_warlord_desc: "拥有地盘的军团——名义臣属，实际自立。征收自己的赋税，听调不听宣；宗主受难时，可能割据独立。"
