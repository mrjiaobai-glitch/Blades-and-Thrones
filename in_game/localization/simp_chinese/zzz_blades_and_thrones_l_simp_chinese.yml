 blades_and_thrones_company.4.title: "军团羽翼渐丰"
 blades_and_thrones_company.4.desc: "你的军团已成长为更强大的形态：武力的增长让老兵们开始有自己的想法，也让它们拥有了脱离宗主的力量。军饷的开销也随之上涨。"
 blades_and_thrones_company.4.a: "知道了"
 blades_and_thrones_company.5.title: "军团元气大伤"
 blades_and_thrones_company.5.desc: "连年损耗让军团元气大伤，实力远不如前——它们失去了脱离宗主的力量，回到了依赖宗主庇护的弱小形态，军饷开销也回落到原来的水平。"
 blades_and_thrones_company.5.a: "知道了"
 blades_and_thrones_company.6.title: "藩镇割据"
 blades_and_thrones_company.6.desc: "军团获得了地盘——从流动的军队变成了地方的势力。它开始征收自己的赋税，王室的号令在它的地界上越来越不管用。它仍名义上臣属于王室，但所有人都知道：它已是听调不听宣的一方诸侯。"
 blades_and_thrones_company.6.a: "知道了"
 blades_and_thrones_revoke_warlord_land: "收回藩地"
 blades_and_thrones_revoke_warlord_land_desc: "从军阀手中收回一块领地。只对临近度较高的土地有意义——无临近度的负收益地不妨继续让军阀打理。收回会激怒军阀（忠诚大降）；收光其全部地盘将使其失去军阀身份，重归无地军团。"
 blades_and_thrones_exchange_warlord_land: "换地"
 blades_and_thrones_exchange_warlord_land_desc: "用自己的一块土地与军阀交换——以更远的换更近的。军阀得到补偿，关系影响远小于直接收回。"
 blades_and_thrones_revoke_no_warlords: "@trigger_no!没有可收回藩地的军阀。"
 blades_and_thrones_revoke_no_locations: "@trigger_no!该军阀没有可收回的领地。"
 STATIC_MODIFIER_NAME_blades_and_thrones_revoked_land_modifier: "削藩记恨"
 STATIC_MODIFIER_DESC_blades_and_thrones_revoked_land_modifier: "王室收回了军阀的土地，军阀记恨在心。"
 STATIC_MODIFIER_NAME_blades_and_thrones_exchanged_land_modifier: "换地余波"
 STATIC_MODIFIER_DESC_blades_and_thrones_exchanged_land_modifier: "王室用土地换走了军阀的领地，军阀勉强接受。"
 blades_and_thrones_company.7.title: "削藩"
 blades_and_thrones_company.7.desc: "王室收回了军阀的一块领地。军阀在表面上俯首听命，但营帐里的气氛变得冰冷——这笔账，它们记下了。"
 blades_and_thrones_company.7.a: "知道了"
 blades_and_thrones_company.8.title: "藩地尽失"
 blades_and_thrones_company.8.desc: "军阀失去了最后一块地盘——没有土地的军队不再是一方诸侯，它重新沦为王室麾下的一支军团，军饷也恢复了发放。"
 blades_and_thrones_company.8.a: "知道了"
 blades_and_thrones_company.9.title: "年度军费账单"
 blades_and_thrones_company.9.desc: "本年度的军团拨款已经发放，共计 [ROOT.GetVariable('blades_and_thrones_bill_total').GetValue|V0] 金。\n· 雇佣津贴（低级佣兵）：[ROOT.GetVariable('blades_and_thrones_bill_level1').GetValue|V0] 金\n· 军费拨款（代管军团）：[ROOT.GetVariable('blades_and_thrones_bill_level2').GetValue|V0] 金\n· 老兵雇佣津贴（强力佣兵国）：[ROOT.GetVariable('blades_and_thrones_bill_level3').GetValue|V0] 金\n· 大军团军费拨款（大型代管）：[ROOT.GetVariable('blades_and_thrones_bill_level4').GetValue|V0] 金"
 blades_and_thrones_company.9.a: "知道了"
