 blades_and_thrones_loyalty.4.c: "铁腕清洗"
 blades_and_thrones_loyalty.4.c.tt: "铁腕清洗：贵族、教士、市民人口各减 10%，获得永久『清洗后的铁腕秩序』修正与 10 年『军政府清洗余波』，士兵满意——但王室正统与稳定荡然无存。"
