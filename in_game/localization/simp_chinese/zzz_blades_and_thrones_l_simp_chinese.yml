 BLADES_CONVERSION_TITLE: "军事转化"
 BLADES_CONVERSION_SUBTITLE: "常备军、雇佣兵、无地军团与士兵人口之间的相互转化。"
 BLADES_CONVERSION_FOOTER: "选择转化后可在弹窗中指定目标部队、佣兵、军团或地点。"
 mercenary_mutiny_test.1.m.tt: "设置强制政变标记：满足其他启动条件（士兵阶层存在、无其他灾难、无冷却、非内战）时，次月必定触发军事政变灾难。"
 blades_and_thrones_company.1.c.tt: "放弃当前国家，亲自统领这支佣兵军团，流浪天下。"
 blades_and_thrones_company.1.d: "转为代管军团"
 blades_and_thrones_company.1.d.tt: "军团转为国家军队的代管机构：听令于王室，防御必参、进攻可召，由王室军费供养——但从此再无佣兵的自主与暴利。"
 blades_and_thrones_appoint_company_ruler: "指派军团统治者"
 blades_and_thrones_appoint_company_ruler_desc: "指派一位宫廷角色前往一支佣兵军团国，出任其统治者。"
