 blades_and_thrones_war.2.b: "清洗将领"
 blades_and_thrones_war.2.b.tt: "正统性下降，士兵满意度大幅下降，军队被清洗，军政府掌控力+5，消除战败耻辱。"
 blades_and_thrones_war.2.c: "文官善后"
