 blades_and_thrones_food_access_reform: "四海为家"
 blades_and_thrones_food_access_reform_desc: "军团四海为家——获准在驻留之地购买粮食，并自动获得各国过境通行权。无论走到哪里，军队都有粮可食、有路可行。"
 blades_and_thrones_food_access_tt: "军队驻留他国时，自动与地主建立食物获取权（food access）关系；同时自动与外交范围内所有非交战国家建立军事通行权（military access）关系。"
 blades_and_thrones_loyalty.1.b.tt: "授予士兵阶层『军籍登记』特权：士兵满意度上升，但阶层力量也随之增长。"
 blades_and_thrones_loyalty.1.c.tt: "强硬拒绝：稳定度下降，士兵阶层严重不满——忠诚将继续恶化。"
 blades_and_thrones_loyalty.2.a.tt: "军队忠诚高涨：犒赏全军，士兵阶层满意，声望上升。"
 blades_and_thrones_loyalty.3.a.tt: "接受军人接管：士兵阶层出身的军人成为统治者，士兵大悦（稳定小降），随后你将直面军政府的选择。"
 blades_and_thrones_loyalty.3.b.tt: "镇压政变：稳定小降、声望上升，但士兵阶层严重不满——怨恨可能招致下一次更快的政变。"
 blades_and_thrones_loyalty.3.c.tt: "政治妥协：与军队达成『军事妥协』（10 年），稳定上升、士兵满意，但军队获得更大权力。"
 blades_and_thrones_loyalty.4.a.tt: "还政王室：获得永久『文官复位』修正（正统、稳定、声望），正统大幅恢复，士兵阶层略有不快——军人被夺权，心有不甘（12 个月内哗变风险升高）。"
 blades_and_thrones_loyalty.4.b.tt: "制度化巩固：获得永久『军政府制度化』修正（军事传统、人力、军队效率），声望上升，士兵满意——军人的统治名正言顺。"
 blades_and_thrones_loyalty.5.b.tt: "军政府崩溃：还政王室，获得 10 年『崩溃余波』，稳定度大损。"
 blades_and_thrones_loyalty.5.c.tt: "二次夺权：彻底排除文官，获得永久『极端军人统治』修正，士兵大悦。"
 blades_and_thrones_loyalty.6.b.tt: "拒绝还政：稳定小降，士兵满意——但政权合法性持续受损。"
 blades_and_thrones_loyalty.6.c.tt: "军政共治：军队保留部分权力，获得『被迫共治』修正，正统与各阶层关系改善。"
 blades_and_thrones_loyalty.7.a.tt: "和平还政：获得永久『复辟者』修正，正统性大幅恢复，稳定上升——但被夺权的军人心有不甘（复辟余波 12 个月）。"
 blades_and_thrones_loyalty.7.b.tt: "军政共治：军队保留政治地位，获得『共治』修正，正统与稳定小幅恢复。"
 blades_and_thrones_loyalty.7.c.tt: "暂缓还政：维持军政府 36 个月后再议，稳定小幅上升。"
 blades_and_thrones_loyalty.8.a.tt: "加饷安抚：花费 [ROOT.GetVariable('blades_and_thrones_extra_pay_display').GetValue|V0] 金平息哗变——军队满意，但王室示弱（稳定、正统小降）。"
 blades_and_thrones_loyalty.8.b.tt: "强硬镇压：当场压住（声望上升、稳定下降），但士兵满意度大降，军人记恨 24 个月——政变阈值放宽。"
 blades_and_thrones_loyalty.8.c.tt: "放任不管：军队得寸进尺，忠诚与稳定继续恶化——哗变只是开始。"
 blades_and_thrones_regency.1.a.tt: "军人摄政当家：牺牲贵族、教士、市民阶层的利益，换取陆军传统上升。"
 blades_and_thrones_regency.1.b.tt: "约束摄政军人：士兵阶层不满，但其他阶层安心。"
 blades_and_thrones_regency.2.a.tt: "和平还政：稳定上升，士兵阶层不满。"
 blades_and_thrones_regency.2.b.tt: "拒绝还政（延长摄政 10 年）：正统受损——军人摄政将触发军事政变路径。"
