 blades_and_thrones_conversion.1.g.tt: "把一块领土赠予流亡者，让他们安家立业（获得土地后他们会自行转正）。"
 STATIC_MODIFIER_NAME_blades_and_thrones_settled_military_modifier: "老兵治国"
 STATIC_MODIFIER_DESC_blades_and_thrones_settled_military_modifier: "从雇佣兵到领主：军事传统增长，人力与兵源提升。"
 STATIC_MODIFIER_NAME_blades_and_thrones_restored_country_modifier: "复国者"
 STATIC_MODIFIER_DESC_blades_and_thrones_restored_country_modifier: "光复故都的流亡者：正统性缓慢恢复，军事传统增长，外交声誉提升。"
 AUTO_MODIFIER_NAME_blades_and_thrones_landless_looter: "无地劫掠"
 AUTO_MODIFIER_DESC_blades_and_thrones_landless_looter: "流浪军团以刀剑为生：掠夺所得增加。"
 blades_and_thrones_claim_foothold_select_area: "选择征服区域："
