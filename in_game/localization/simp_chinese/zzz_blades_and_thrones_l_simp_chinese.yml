 blades_and_thrones_junta.1.title: "宫墙上的军团旗：军政府求援"
 blades_and_thrones_junta.1.desc: "军团的第一面旗帜已经挂上了宫墙，卫兵换成了按剑而立的军官。贵族们在走廊里压低声音交谈，商人们在账房外排队等候——每个人都想在新秩序里占一个位置。\n\n军政府的军官们直言不讳：要稳住局面，需要银子、支持，或者一场足以转移视线的胜利。他们等着你的答复。"
 blades_and_thrones_junta.1.a: "让利士兵"
 blades_and_thrones_junta.1.a.tt: "向士兵阶层支付 [ROOT.GetVariable('blades_and_thrones_junta_handout_display').GetValue|V0] 金币（6个月军饷），军政府掌控力+6。"
 blades_and_thrones_junta.1.b: "安抚市民与贵族"
 blades_and_thrones_junta.1.b.tt: "花费月收入的 25% 提升正统性与军政府掌控力，但士兵阶层满意度下降。"
 blades_and_thrones_junta.1.c: "镇压异见"
 blades_and_thrones_junta.1.c.tt: "消耗国家稳定度，军政府掌控力+10，士兵满意度上升。"
 blades_and_thrones_junta.1.d: "行政整顿"
 blades_and_thrones_junta.1.d.tt: "花费月收入的 15% 提升正统性与军政府掌控力。"
 blades_and_thrones_junta.2.title: "军官的争吵：两派争夺兵符"
 blades_and_thrones_junta.2.desc: "军官食堂里的争吵已经传到了街上。强硬派主张以刀剑立威——更多的阅兵、更重的军饷、更少的文官；温和派则希望与旧贵族讲和，把军队拉回营房。两派的首领都派了亲信来探你的口风，而军营里的士兵们正等着看谁赢。"
 blades_and_thrones_junta.2.a: "支持强硬派"
 blades_and_thrones_junta.2.a.tt: "军政府掌控力+5，正统性下降，士兵满意度上升，其他阶层心生不满。"
 blades_and_thrones_junta.2.b: "支持温和派"
 blades_and_thrones_junta.2.b.tt: "军政府掌控力-4，正统性上升，军队忠诚改善，但士兵满意度下降。"
 blades_and_thrones_junta.2.c: "押注派系"
 blades_and_thrones_junta.2.c.tt: "随机一方获胜：强硬派获胜掌控力+8，温和派获胜掌控力-6。"
 blades_and_thrones_junta.99.title: "军政府掌控力调试"
 blades_and_thrones_junta.99.desc: "快速调整军政府掌控力，用于测试路线。"
 blades_and_thrones_junta.99.a: "+10"
 blades_and_thrones_junta.99.b: "-10"
 blades_and_thrones_junta.99.c: "设为75"
 blades_and_thrones_junta.99.d: "设为45"
 blades_and_thrones_junta.99.e: "设为25"
 blades_and_thrones_military_junta_reform: "军政府"
 blades_and_thrones_military_junta_reform_desc: "士兵阶层接管国家权力，王室和文官阶层影响力下降，其他阶层被迫承担更高税负，士兵阶层本身不再纳税，全国叛乱增长放缓。"
 blades_and_thrones_loyalty.4.title: "军政府的选择：王座、兵符与屠刀"
 blades_and_thrones_loyalty.4.desc: "军靴声已经踏遍了官署。军队接管了国政，士兵出身的军人坐上了王座——但军政府终究要回答一个问题：是交还权力、把这页揭过去，还是让军人的统治名正言顺地延续，或者干脆用刀剑让所有质疑者闭嘴。"
 blades_and_thrones_loyalty.4.a: "还政王室"
 blades_and_thrones_loyalty.4.b: "制度化巩固"
 blades_and_thrones_loyalty.5.title: "军官的分裂：军政府裂痕"
 blades_and_thrones_loyalty.5.desc: "战局不利、国库空虚、士兵们开始私下议论——军政府内部的分歧终于爆发了。一派军官主张用铁腕清洗一切不忠，另一派则认为应该体面收场、趁早交权。两派都派人盯着你的决定，而军营里已经有人在磨刀。"
 blades_and_thrones_loyalty.5.a: "血腥清洗"
 blades_and_thrones_loyalty.5.a.tt: "清洗将处决部分贵族、教士与市民，令其人口蒙受损失；士兵阶层支持这次清洗。"
 blades_and_thrones_loyalty.5.b: "让军政府全面崩溃"
 blades_and_thrones_loyalty.5.c: "二次夺权，强化军人统治"
 blades_and_thrones_loyalty.6.title: "墙倒众人推：军政府交权"
 blades_and_thrones_loyalty.6.desc: "街头的反对声浪一天高过一天，商人们拒绝纳税，连士兵都开始用沉默表达不满。军政府撑不住了——军官们面色阴沉地承认：要么体面交权，要么被愤怒的浪潮吞没。还政已是唯一体面的出路。"
 blades_and_thrones_loyalty.6.a: "被迫和平还政"
 blades_and_thrones_loyalty.6.a.tt: "还政后不会留下长期制度奖励，但军政府危机可能再次出现。"
 blades_and_thrones_loyalty.6.b: "拒绝还政"
 blades_and_thrones_loyalty.6.c: "弱势军政共治"
 blades_and_thrones_loyalty.7.title: "将军的抉择：体面还政"
 blades_and_thrones_loyalty.7.desc: "局势已经稳住：秩序恢复，国库有了盈余，军队依然效忠。军政府现在握有选择权——可以从容地把权力交还文官，留下'保国安民'的名声；也可以与文官共治；或者，继续握住权柄不放。将军们等着你的决定。"
 blades_and_thrones_loyalty.7.a: "主动和平还政"
 blades_and_thrones_loyalty.7.b: "主动军政共治"
 blades_and_thrones_loyalty.7.c: "继续维持军人统治"
 STATIC_MODIFIER_NAME_blades_and_thrones_junta_established_modifier: "军政府制度化"
 STATIC_MODIFIER_DESC_blades_and_thrones_junta_established_modifier: "国家被改造成长期军事体制，军队地位稳固，军费与外交声誉压力上升。"
 STATIC_MODIFIER_NAME_blades_and_thrones_junta_purge_aftermath_modifier: "军政府清洗余波"
 STATIC_MODIFIER_DESC_blades_and_thrones_junta_purge_aftermath_modifier: "军官阶层被清洗，军队传统受损，但短期叛乱被压制。"
 STATIC_MODIFIER_NAME_blades_and_thrones_junta_purge_legacy_modifier: "清洗后的铁腕秩序"
 STATIC_MODIFIER_DESC_blades_and_thrones_junta_purge_legacy_modifier: "清洗结束了长期混乱，王权与秩序恢复，但军队仍因清洗而受损。"
 STATIC_MODIFIER_NAME_blades_and_thrones_junta_collapse_modifier: "军政府崩溃余波"
 STATIC_MODIFIER_DESC_blades_and_thrones_junta_collapse_modifier: "军政府彻底崩溃，国家陷入政治混乱，王室与文官重建权威。"
 STATIC_MODIFIER_NAME_blades_and_thrones_junta_collapse_legacy_modifier: "崩溃后的国家重建"
 STATIC_MODIFIER_DESC_blades_and_thrones_junta_collapse_legacy_modifier: "国家从军政府崩溃中恢复，文官权威增强，重建成本降低。"
 STATIC_MODIFIER_NAME_blades_and_thrones_junta_restored_modifier: "文官复位"
 STATIC_MODIFIER_DESC_blades_and_thrones_junta_restored_modifier: "军政府主动还政，文官政府恢复长期统治，国家回归正常轨道。"
 STATIC_MODIFIER_NAME_blades_and_thrones_junta_cogovernance_modifier: "军政共治"
 STATIC_MODIFIER_DESC_blades_and_thrones_junta_cogovernance_modifier: "军队从强势地位与文官共享权力，国家恢复稳定，但军队保留重要政治地位并带来军费负担。"
 STATIC_MODIFIER_NAME_blades_and_thrones_junta_restoration_pain_modifier: "还政阵痛"
 STATIC_MODIFIER_DESC_blades_and_thrones_junta_restoration_pain_modifier: "军政府突然交权后的政治混乱，稳定度投资更困难，叛乱与正统性压力上升。"
 STATIC_MODIFIER_NAME_blades_and_thrones_junta_forced_cogovernance_modifier: "弱势军政共治"
 STATIC_MODIFIER_DESC_blades_and_thrones_junta_forced_cogovernance_modifier: "军队在弱势时与文官达成妥协，只保留了有限的政治地位与军费保障。"
 STATIC_MODIFIER_NAME_blades_and_thrones_junta_hardened_modifier: "极端军人统治"
 STATIC_MODIFIER_DESC_blades_and_thrones_junta_hardened_modifier: "军政府通过二次夺权彻底排除文官势力，国家完全军事化。"
 blades_and_thrones_loyalty.8.title: "兵变之夜"
 blades_and_thrones_loyalty.8.historical_info: "雇佣军反噬其主的故事贯穿古今——从迦太基的雇佣兵之乱，到罗马军团拥立皇帝。刀剑一旦成为政治砝码，王座的命运就不再只由王冠决定。本模组的军事危机系统正是这条历史规律的缩影：军队的力量总在君主最虚弱时索取代价。"
 blades_and_thrones_loyalty.8.desc.critical: "营门紧闭，哨兵换成了生面孔。入夜后几队士兵闯进军械库，把火绳枪和火药搬了个精光。百夫长们既不阻拦也不上报——他们只是在等一个答复。\n当前军队忠诚：[ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]。"
 blades_and_thrones_loyalty.8.desc.low: "夜幕降临时，军营里传来零星的枪声和口令声——不是演习的口令。几座营帐被掀翻，值夜的军官被缴了械，士兵们堵在营门口，要求一个说法。哗变一触即发。\n当前军队忠诚：[ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]。"
 blades_and_thrones_loyalty.8.desc.base: "军营气氛不对：操练停了，伙房停了，只有磨刀声不断。老兵们围着篝火低声议论，新兵则攥紧了武器——他们等的不是明天的号令，而是王座的一个答复。\n当前军队忠诚：[ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]。"
 blades_and_thrones_loyalty.8.a: "加饷安抚（花费 [ROOT.GetVariable('blades_and_thrones_extra_pay_display').GetValue|V0] 金）"
 blades_and_thrones_loyalty.8.b: "强硬镇压"
 blades_and_thrones_loyalty.8.c: "放任不管"
 blades_and_thrones_loyalty.1.title: "军队不满"
 blades_and_thrones_loyalty.1.desc.critical: "军情急报：军营里已经听不到敬礼声了。士兵们望着王宫的方向，眼神像望着仇敌。老兵们在夜里擦拭武器，新兵在打听'换了主公之后军饷会不会照发'。再拖下去，第一个举旗的人恐怕不用等到下个月圆。\n当前军队忠诚：[ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]。"
 blades_and_thrones_loyalty.1.desc.low: "军营的气氛阴沉得能拧出水。领饷时队伍里开始有人小声议论：'王上欠我们的，总该有个说法。'几个百夫长递上了联名请愿书，措辞恭敬，落款处却按满了指印——那架势更像是最后通牒。\n当前军队忠诚：[ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]。"
 blades_and_thrones_loyalty.1.desc.mid: "军中传言四起，说王室打算克扣军饷去修新的行宫。士兵们虽还照常操练，但望向军官的眼神里多了一层审视。宿将们劝谏：'军心如水，堵不如疏。'\n当前军队忠诚：[ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]。"
 blades_and_thrones_loyalty.1.desc.base: "军队忠诚出现波动。虽远未到哗变的程度，但军营里的牢骚比往年多了不少——有人说欠饷，有人说赏赐不公，有人说军中的酒掺了水。枢密院提醒：军心之事，宜早不宜迟。\n当前军队忠诚：[ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]。"
 blades_and_thrones_loyalty.1.a: "支付额外军饷"
 blades_and_thrones_loyalty.1.b: "授予军籍登记特权"
 blades_and_thrones_loyalty.1.c: "强硬拒绝"
 blades_and_thrones_loyalty.2.title: "军队捍卫王座"
 blades_and_thrones_loyalty.2.desc: "军队忠诚高昂。士兵阶层愿意在政治风波中站在王室一边。\n当前军队忠诚：[ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]。"
 blades_and_thrones_loyalty.2.a: "嘉奖军队"
 blades_and_thrones_loyalty.3.title: "兵变：营门与王座之间"
 blades_and_thrones_loyalty.3.historical_info: "从禁卫军换皇帝到总督拥兵自重，军队夺权是君主制最古老的噩梦。奥古斯都的禁卫军、拜占庭的军区将领、奥斯曼的禁卫军团——刀剑的忠诚从来都是价高者得。当士兵阶层的力量压过王座，政变就只是时间问题。"
 blades_and_thrones_loyalty.3.desc: "宫门在深夜被撞开，卫兵换成了陌生的面孔。军团列队穿过广场，鼓点敲得沉稳而坚定——这不是骚乱，是一场政变。军官们派人送来了一份宣言：军队将接管国政，为首者将登临王座，直到'局势恢复稳定'。\n当前军队忠诚：[ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]。"
 blades_and_thrones_loyalty.3.a: "接受军人接管"
 blades_and_thrones_loyalty.3.b: "血腥镇压兵变"
 blades_and_thrones_loyalty.3.c: "与军队达成政治妥协"
 zzz_rebalanced_nepal_mercenary_soldiers_estate_regency: "军人摄政"
 zzz_rebalanced_nepal_mercenary_soldiers_estate_regency_desc: "当国家没有统治者时，士兵阶层的成员可能以摄政身份执掌国政。"
 blades_and_thrones_regency.1.title: "军头摄政的代价"
 blades_and_thrones_regency.1.desc: "摄政王以军营的规矩治理国家：口令取代奏章，校场取代朝堂。贵族与教士在走廊里低声抱怨，市民们担心账簿被军令翻查——而军营里的士兵们满意地看着这一切。"
 blades_and_thrones_regency.1.a: "纵容军头专权"
 blades_and_thrones_regency.1.b: "约束摄政王"
 militarism_vs_civilianism: "军国主义 vs 文官主义"
 militarism_vs_civilianism_desc: "军国之路以武立国：军队传统、士气与兵源俱佳，士兵阶层影响力水涨船高——而军队的政治胃口也随之增长；文官之路以文治国：内阁、研究与稳定投资领先，贵族如沐春风。"
 militarism_focus: "军国"
 civilianism_focus: "文官"
 MODIFIER_TYPE_NAME_monthly_towards_militarism: "月度军国化进度"
 MODIFIER_TYPE_DESC_monthly_towards_militarism: "影响社会价值观向 [ShowSocietyDirectionName('militarism')] 移动的进度。"
 MODIFIER_TYPE_NAME_monthly_towards_civilianism: "月度文官化进度"
 MODIFIER_TYPE_DESC_monthly_towards_civilianism: "影响社会价值观向 [ShowSocietyDirectionName('civilianism')] 移动的进度。"
 blades_and_thrones_company_tradition_reform: "佣兵传统"
 blades_and_thrones_company_tradition_reform_desc: "军团以佣兵为荣：佣兵维护更廉价、佣兵规模更大、军队传统日增——但佣兵的名声让王室蒙尘，国家亦被推向军国之路。"
 blades_and_thrones_company_regularize_reform: "雇佣兵团化"
 blades_and_thrones_company_regularize_reform_desc: "军团洗白成正规军：纪律与士气焕然一新、军费更有效率——但失去佣兵网络的折扣，再招佣兵代价更高，国家亦被推向文官之路。"
 blades_and_thrones_company_looting_reform: "掠夺方针"
 blades_and_thrones_company_looting_reform_desc: "以战养战：掠夺收益大增——但常年的劫掠让国家神经紧绷、恶名远扬，外交上也越发好战。"
 blades_and_thrones_regency.2.title: "拒绝还政"
 blades_and_thrones_regency.2.desc: "年轻的继承人已到亲政之年，但摄政王没有还政的意思。兵营里流传着这样的话：'王座需要一个懂得握剑的人。'若摄政王拒绝交权，国家将滑向兵变——而军队已经做好了准备。"
 blades_and_thrones_regency.2.a: "要求还政"
 blades_and_thrones_regency.2.b: "听之任之（摄政王拒绝交权）"
 STATIC_MODIFIER_NAME_blades_and_thrones_military_junta_modifier: "军政府执政"
 STATIC_MODIFIER_DESC_blades_and_thrones_military_junta_modifier: "士兵阶层控制了国家，王室权威被削弱；效果将随时间逐渐消退。"
 STATIC_MODIFIER_NAME_blades_and_thrones_army_purged_modifier: "军队清洗余波"
 STATIC_MODIFIER_DESC_blades_and_thrones_army_purged_modifier: "王室清洗了不可靠的军官，但军队士气和传统受损；效果将随时间逐渐消退。"
 STATIC_MODIFIER_NAME_blades_and_thrones_military_compromise_modifier: "军权妥协"
 STATIC_MODIFIER_DESC_blades_and_thrones_military_compromise_modifier: "王室与军队达成政治交易，士兵阶层获得了更大的政治分量；效果将随时间逐渐消退。"
 blades_and_thrones_war.1.title: "凯旋：得胜之师归国"
 blades_and_thrones_war.1.desc: "城门大开，得胜的军团扛着缴获的旗帜列队入城，百姓抛洒花瓣，钟声响彻全城。但胜利也带来了新的问题：士兵们等着犒赏，军官们盘算着战功该换来多少权力。庆功宴上的每一杯酒，都掺着各自的算盘。\n军队忠诚：[ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]。"
 blades_and_thrones_war.1.a: "犒赏三军"
 blades_and_thrones_war.1.a.tt: "支付 [ROOT.GetVariable('blades_and_thrones_triple_pay_display').GetValue|V0] 金币（3个月军饷）给士兵阶层，士兵满意度上升，军政府掌控力+4。"
 blades_and_thrones_war.1.b: "论功行赏，扩大军权"
