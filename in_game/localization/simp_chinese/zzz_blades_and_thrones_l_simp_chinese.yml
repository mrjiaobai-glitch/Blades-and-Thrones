 blades_and_thrones_landless_passage_relation_desc: "无地军团获准穿越国境并沿途购粮。各国默许其过境——他们毕竟只是路过。"
 STATIC_MODIFIER_NAME_blades_and_thrones_veteran_unrest_modifier: "老兵不满"
 STATIC_MODIFIER_DESC_blades_and_thrones_veteran_unrest_modifier: "和平后欠饷遣散的老兵心怀怨愤——解甲不归心。"
 STATIC_MODIFIER_NAME_blades_and_thrones_veteran_core_modifier: "精锐老兵"
 STATIC_MODIFIER_DESC_blades_and_thrones_veteran_core_modifier: "保留的百战之师：国之干城，代价是更高的军饷与维护。"
 STATIC_MODIFIER_NAME_blades_and_thrones_demobilization_transition_modifier: "退伍过渡期"
 STATIC_MODIFIER_DESC_blades_and_thrones_demobilization_transition_modifier: "就地解散后，士兵期望下降——超编士兵在数月内陆续失业、迁走或归田。"
 STATIC_MODIFIER_NAME_blades_and_thrones_veteran_suppressed_modifier: "镇压余波"
 STATIC_MODIFIER_DESC_blades_and_thrones_veteran_suppressed_modifier: "镇压老兵骚动后的短期代价：人力受损、怨气残留。"
 STATIC_MODIFIER_NAME_blades_and_thrones_veteran_institutionalized_modifier: "精锐制度化"
 STATIC_MODIFIER_DESC_blades_and_thrones_veteran_institutionalized_modifier: "精锐老兵并入常备军，军事传统长存。"
