 blades_and_thrones_company.1.title: "军团的命运：忠诚还是自立？"
 blades_and_thrones_company.1.desc: "军旗已经绣好，战马已经备鞍——[Root.GetName]第[Root.GetVariable('blades_and_thrones_company_counter').GetValue]军团即将踏上征途。它将离开你的直接指挥，成为一支挂着你的纹章、却要自己闯荡的无地军团。将军们问：这支军团，是要以忠诚立身，还是任其自行其是？"
