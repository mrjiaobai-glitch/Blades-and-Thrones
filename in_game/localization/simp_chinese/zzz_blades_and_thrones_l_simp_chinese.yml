l_simp_chinese:

 mercenary_mutiny: "雇佣兵夺舍"
 blades_and_thrones_military_doctrine_law: "军制与国家"
 blades_and_thrones_military_doctrine_law_desc: "军队从何而来、向谁效忠，决定了刀锋最终属于王座、阶层还是金钱。\n当前军队忠诚：[ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]。"
 standing_army_state_policy: "常备军国家"
 standing_army_state_policy_desc: "建立由王室供养和指挥的常备军。士兵阶层成为王权延伸，但军饷与忠诚会直接牵动国家稳定。高忠诚时军队会成为王权支柱；忠诚崩坏时政变风险更高。"
 mercenary_league_policy: "雇佣兵联盟"
 mercenary_league_policy_desc: "国家少养常备军，将战争外包给佣兵团。商人与佣兵获利，士兵阶层和君主则失去对暴力的垄断。士兵阶层政变风险较低，但佣兵威胁与夺舍风险上升。"
 mixed_military_policy: "混合军制"
 mixed_military_policy_desc: "常备军、征召兵与佣兵并存，让国家在成本、专业性和政治风险之间保持平衡。忠诚与政变风险居中。"
 levy_state_policy: "征召军制"
 levy_state_policy_desc: "国家依赖贵族和农民征召兵，军费更低，但士兵阶层难以形成独立政治力量。士兵阶层影响力与政变风险都较低。"
 zzz_rebalanced_nepal_mercenary_soldiers_estate: "士兵"
 zzz_rebalanced_nepal_mercenary_soldiers_estate_desc: "这一阶层代表我国以刀剑为业、以战争为生的军人群体，包括职业士兵、佣兵与军官。他们的传统职责是保卫王国并执行国家的武装意志，其力量来自人数、纪律与军务，而非出身或财富。\n$estate_common_crown_ending$"
 zzz_mercenary_mutiny_soldiers_military_register: "士兵军籍登记"
 zzz_mercenary_mutiny_soldiers_military_register_desc: "将职业士兵编入国家军籍，规范服役与军饷义务。军饷以常备军编制为准；战时被征召为地方民兵的军人按义务兵役供给，不另占军饷。"
 zzz_mercenary_mutiny_soldiers_professional_officer_corps: "职业军官团"
 zzz_mercenary_mutiny_soldiers_professional_officer_corps_desc: "建立以战功和军阶为基础的晋升体系，提高军队专业水准。"
 zzz_mercenary_mutiny_soldiers_state_mercenary_contracts: "国家佣兵契约"
 zzz_mercenary_mutiny_soldiers_state_mercenary_contracts_desc: "由士兵阶层出面组织佣兵合同，扩充国家可用的精锐作战力量。"
 zzz_mercenary_mutiny_soldiers_military_courts: "军中司法权"
 zzz_mercenary_mutiny_soldiers_military_courts_desc: "士兵受军法管辖，纪律更加严明，但军事集团也会变得更加独立。"
 zzz_mercenary_mutiny_soldiers_standing_army: "常备军薪饷"
 zzz_mercenary_mutiny_soldiers_standing_army_desc: "国家保障职业士兵的固定薪饷与兵营供给，使军队保持常备状态。"
 zzz_mercenary_mutiny_soldiers_old_soldiers_council: "老兵议会"
 zzz_mercenary_mutiny_soldiers_old_soldiers_council_desc: "让退役军官参与国家决策，为战争与防务提供经验建议。"
 zzz_mercenary_mutiny_soldiers_idle_production: "允许军队闲暇生产"
 zzz_mercenary_mutiny_soldiers_idle_production_desc: "士兵在服役间隙从事生产并扩建原产，阶层更加富足稳定，但也因此减少了操练时间。"
 zzz_mercenary_mutiny_soldiers_farmer_supply_train: "强征农夫辎重队"
 zzz_mercenary_mutiny_soldiers_farmer_supply_train_desc: "军队在补给不足时强征农夫组成辎重队，扩大后勤距离，但也加重了农民阶层的负担。"
 zzz_rebalanced_nepal_mercenary_soldiers_royal_hand: "王室之手"
 zzz_rebalanced_nepal_mercenary_soldiers_royal_hand_desc: "王室授权士兵阶层维持秩序并压制其他阶层。士兵获得更多权力，但一旦忠诚动摇，这支军队也会成为王室最危险的威胁。"
 AUTO_MODIFIER_NAME_zzz_rebalanced_nepal_mercenary_soldiers_royal_hand_disloyal: "王室之手失控"
 AUTO_MODIFIER_DESC_zzz_rebalanced_nepal_mercenary_soldiers_royal_hand_disloyal: "士兵阶层对王室不满，王室的压制能力失效，军队开始倾向叛乱。"
 AUTO_MODIFIER_NAME_zzz_mercenary_mutiny_soldier_pay_redirect: "士兵薪饷转拨"
 AUTO_MODIFIER_DESC_zzz_mercenary_mutiny_soldier_pay_redirect: "国库每月按编制向士兵阶层发放固定军饷。军饷是独立的现金俸禄，与维护费无关——维护费用于补给与装备，军饷按人头计发。"
 AUTO_MODIFIER_NAME_blades_and_thrones_army_loyalty_display: "当前军队忠诚"
 AUTO_MODIFIER_DESC_blades_and_thrones_army_loyalty_display: "反映军队当前对国家、王室和士兵阶层政治力量的真实立场。"
 AUTO_MODIFIER_NAME_blades_and_thrones_army_loyal_effect: "军队忠诚高昂"
 AUTO_MODIFIER_DESC_blades_and_thrones_army_loyal_effect: "忠诚的军队帮助王室维持秩序，并降低士兵阶层叛乱风险。"
 AUTO_MODIFIER_NAME_blades_and_thrones_army_disloyal_effect: "军队忠诚崩坏"
 AUTO_MODIFIER_DESC_blades_and_thrones_army_disloyal_effect: "不忠的军队削弱王室权威，增加士兵阶层叛乱和政变风险。"
 MODIFIER_TYPE_NAME_zzz_rebalanced_nepal_mercenary_soldiers_estate_target_satisfaction: "士兵阶层满意度均衡"
 MODIFIER_TYPE_NAME_global_zzz_rebalanced_nepal_mercenary_soldiers_army_loyalty: "当前军队忠诚"
 MODIFIER_TYPE_DESC_global_zzz_rebalanced_nepal_mercenary_soldiers_army_loyalty: "受士兵阶层满意度、士兵阶层力量、王室力量、陆军与堡垒维护滑条、王室之手、雇佣兵威胁、稳定度、战争疲劳、战争状态和军制政策影响。"
 MODIFIER_TYPE_NAME_monthly_zzz_rebalanced_nepal_mercenary_soldiers_pay: "当前月份军饷"
 MODIFIER_TYPE_DESC_monthly_zzz_rebalanced_nepal_mercenary_soldiers_pay: "本月国库转移给士兵阶层的固定军饷——常备军每千人每月 5 金，另每座堡垒每月 1 金。与维护费无关。"
 MODIFIER_TYPE_DESC_zzz_rebalanced_nepal_mercenary_soldiers_estate_target_satisfaction: "影响本国内 $zzz_rebalanced_nepal_mercenary_soldiers_estate$ 的满意度均衡。"
 AUTO_MODIFIER_NAME_zzz_rebalanced_nepal_mercenary_soldiers_estate_mercenary_pressure: "雇佣兵规模威胁"
 AUTO_MODIFIER_DESC_zzz_rebalanced_nepal_mercenary_soldiers_estate_mercenary_pressure: "雇佣兵兵力相对国家可控军力越高，士兵阶层的满意度均衡越低。"
 AUTO_MODIFIER_NAME_zzz_blades_and_thrones_soldiers_base_satisfaction: "士兵阶层基础满意度"
 AUTO_MODIFIER_DESC_zzz_blades_and_thrones_soldiers_base_satisfaction: "设定士兵阶层满意度均衡目标的国家基础值。"
 mercenary_mutiny_exiles_name: "流亡佣兵团"
 mercenary_mutiny_exiles_name_ADJ: "流亡佣兵"
 mercenary_mutiny_annex_exiles_name: "流亡者"
 mercenary_mutiny_annex_exiles_name_ADJ: "流亡者"
 mercenary_mutiny_exiles_reform: "无地军团"
 mercenary_mutiny_exiles_reform_desc: "失去国土却依然成军的战争共同体——以佣兵合同、海外据点和战利品维生，在异乡的营火旁等待命运：复国、安家，或自立为王。流亡者与佣兵军团皆属此列。"
 mercenary_mutiny_manpower_pool: "军团人力池"
 mercenary_mutiny_manpower_pool_desc: "一座设立在外国城镇的招募据点，征用当地士兵人口，每月为军团国提供 5 点人力。"
 mercenary_mutiny_manpower_pool_unlock_tt: "允许建造军团人力池外国建筑"
 mercenary_mutiny_contract_hall: "军团合同大厅"
 mercenary_mutiny_contract_hall_desc: "一座设立在外国城镇的合同大厅，各国雇主在此签下雇佣契约。每座每月为军团国带来 1 金合同抽成，并附带少量贸易容量；每个地点限建一座，可在多个城镇各建一座。"
 mercenary_mutiny_company_port: "军团港"
 mercenary_mutiny_company_port_desc: "一座设立在外国沿海城镇的港口据点，供军团国停泊舰队、招募水手、染指沿海贸易。每座提供港口容量与少量水手，并带来少量贸易容量；仅可建在沿海地点。"
 mercenary_mutiny_company_port_unlock_tt: "允许建造军团港外国建筑"
 mercenary_mutiny_state: "佣兵国"
 mercenary_mutiny_state_adj: "佣兵"
 mercenary_mutiny_army_country_subsidy: "佣兵军团补贴"
 mercenary_mutiny_army_country_subsidy_desc: "用于维持无领土佣兵军团的月度补贴。"
 mercenary_mutiny_test.1.title: "刀锋与王座"
 mercenary_mutiny_test.1.desc: "佣兵、常备军与国家政治联动系统的调试菜单。"
 mercenary_mutiny_test.1.a: "显示调试数值"
 mercenary_mutiny_test.1.b: "生成夺舍叛军"
 mercenary_mutiny_test.1.c: "让叛军立即胜利"
 mercenary_mutiny_test.1.d: "模拟夺舍"
 mercenary_mutiny_test.1.e: "关闭"
 mercenary_mutiny_test.1.f: "创建无地军团国并转移佣兵"
 mercenary_mutiny_test.1.b.tt: "生成雇佣兵夺舍叛军，并设置初始进度。"
 mercenary_mutiny_test.1.c.tt: "让当前雇佣兵夺舍叛军立即胜利并强制启动内战。"
 mercenary_mutiny_test.1.d.tt: "直接模拟夺舍：改名、换统治者、解散佣兵、生成士兵 POP。"
 mercenary_mutiny_test.1.f.tt: "创建一个无地军团国，使其成为不忠附属国，并把所有已雇佣的佣兵转移给它。"
 mercenary_mutiny_test.2.title: "国家覆灭"
 mercenary_mutiny_test.2.desc: "你的国家即将被吞并，但残存的常备军或雇佣兵已经组成一支名为“流亡者”的无地军团。你可以就此接受败亡，也可以接管这支军团继续奋战。"
 mercenary_mutiny_test.2.a: "接管无地军团"
 mercenary_mutiny_test.2.b: "接受败亡"
 mercenary_mutiny_test.3.title: "吞并转军团测试"
 mercenary_mutiny_test.3.desc: "调试事件：模拟“国家被吞并 → 残部转为流亡者军团国”。两种用法——\n· 在 AI 吞并国上触发（event mercenary_mutiny_test.3 <AI国TAG>）：AI 自动随机选一名人类玩家作为被吞并对象，对其执行转换并弹出“国家覆灭”选择事件（触发国自己不会被选中）。\n· 在自己身上触发（event mercenary_mutiny_test.3）：直接选择“转换并直接切换玩家”，把自己当被吞并对象转换并切换扮演（不走“国家覆灭”）。"
 mercenary_mutiny_test.3.a: "转换并移交"
 mercenary_mutiny_test.3.a.tt: "创建军团国家并转移部队，然后向玩家目标弹出吞并选择事件。"
 mercenary_mutiny_test.3.b: "转换并直接切换玩家"
 mercenary_mutiny_test.3.b.tt: "把自己视为被吞并对象：执行转换，残部转为流亡者军团国（“流亡××”），并立即切换扮演该军团国。"
 mercenary_mutiny_test.4.title: "佣兵团夺得大权"
 mercenary_mutiny_test.4.desc: "佣兵团已经压垮国家并夺取控制权。旧国残部则化身“流亡者”——一支无地流亡军团——继续存在。"
 mercenary_mutiny_test.4.b.tt: "放弃佣兵国，统率旧王朝残部组成的“流亡者”，继续流亡抗争。"
 mercenary_mutiny_test.4.a: "继续"
 mercenary_mutiny_test.5.title: "佣兵团分道扬镳"
 mercenary_mutiny_test.5.desc: "双方都无法彻底击败对方。佣兵团脱离国家自立门户，成为一支名义上臣属、实则不听号令的无地军团。"
 mercenary_mutiny_test.5.a: "继续"
 mercenary_mutiny_test.5.b.tt: "放弃当前国家，接管佣兵军团国。它名义上仍是本国的不忠附属国，你可以自行决定是继续屈居人下还是设法自立。"
 mercenary_mutiny_test.6.title: "佣兵团被剿灭"
 mercenary_mutiny_test.6.desc: "叛乱已被镇压，受雇的佣兵团不复存在。"
 mercenary_mutiny_test.6.a: "继续"
 mercenary_mutiny_test.7.title: "兵变之夜：营门紧闭，火把通明"
 mercenary_mutiny_test.7.historical_info: "雇佣兵是一把双刃剑：和平时期他们耗费国库，战时他们决定胜负，而一旦国家虚弱——他们就会想起自己手里的剑。从迦太基到文艺复兴的佣兵队长，历史反复证明：把军队外包给金钱，就要做好金钱接管国家的准备。"
 mercenary_mutiny_test.7.desc: "入夜，[Root.GetName]边境驻地的城墙上燃起陌生的火把。斥候回报：佣兵队长们紧闭营门，正在广场上宣读一份清单——拖欠的军饷、被克扣的战利品，以及他们为自己新刻的头衔。城内的商人已经开始收拾细软，驿道上马蹄声一夜未歇。\n\n这些受雇的军团不再听命于王室。他们占领了驻地，要求清偿旧账——或者，用他们自己的话来说，清算王室的债务。"
 mercenary_mutiny_test.7.a: "立即镇压"
 mercenary_mutiny_test.7.b: "出钱让他们退兵"
 mercenary_mutiny_test.7.c: "放任他们劫掠"
 mercenary_mutiny_test.8.title: "火势蔓延：叛军正在开价"
 mercenary_mutiny_test.8.desc: "叛军营地外的树上挂满了讨薪的檄文，措辞一封比一封激烈。哨兵报告说，他们正在打造新的攻城器械，甚至有几面旗帜已经换成了陌生的纹章。每过一日，谈判的价码就高一分；每过一日，他们脸上的笑容就少一分耐心。"
 mercenary_mutiny_test.8.a: "支付高额赎金"
 mercenary_mutiny_test.8.b: "发动代价高昂的强攻"
 mercenary_mutiny_test.8.c: "允许他们掠夺"
 mercenary_mutiny_test.9.title: "士兵哗变"
 mercenary_mutiny_test.9.desc: "王室手中的士兵阶层正在倒向叛军。他们要求更高的军饷，或者要挟王室交出更多权力。"
 mercenary_mutiny_test.9.a: "严厉弹压"
 mercenary_mutiny_test.9.b: "加饷安抚"
 mercenary_mutiny_test.9.c: "放任他们接管"
 mercenary_mutiny_test.10.title: "佣兵军团索饷"
 mercenary_mutiny_test.10.desc: "脱离王室控制的佣兵军团如今盘踞在你的疆土之内。他们名义上仍是你的附属国，却拒绝服从任何号令——不进贡、不应征，甚至可能在外敌来袭时倒戈。\n\n如今他们的首领送来一封措辞倨傲的信，羊皮纸的落款处盖着军团纹章：要么支付巨额军饷，换取他们继续效忠五年；要么就等着他们撕毁臣属条约，自立门户。酒馆里的人已经在传：'那些佣兵说，他们是在替自己收账。'"
 mercenary_mutiny_test.10.a.tt: "支付 [ROOT.GetVariable('blades_and_thrones_company_demand_display').GetValue|V0] 金币，佣兵军团将安分五年，军事危机-10。"
 mercenary_mutiny_test.10.b.tt: "他们将会记恨在心（已拒绝 [Root.GetVariable('mercenary_mutiny_company_refusals').GetValue|V0]/2 次）。拒绝两次后，佣兵军团将撕毁臣属条约，宣布完全独立（军事危机+5）。"
 mercenary_mutiny_test.11.title: "佣兵军团宣布独立"
 mercenary_mutiny_test.11.desc: "佣兵军团撕毁了臣属条约，在众目睽睽之下自立门户。他们不再听命于任何人，只认金币。\n军事危机加剧，佣兵自立门户的先例让整个佣兵市场都开始蠢蠢欲动。"
 mercenary_mutiny_test.11.a.tt: "放弃当前国家，追随佣兵军团出走，成为一支完全独立的无地佣兵军团。"
 mercenary_mutiny_test.12.title: "佣兵军团自立门户"
 mercenary_mutiny_test.12.desc: "佣兵军团已经撕毁臣属条约，成为一支完全独立的无地佣兵军团，此刻正盘踞在你的旧疆土边缘。他们的营火在边境线上连成一片，斥候说，营地里挂起了新的军旗——不再有你的纹章。\n\n若你愿意，可以放下王冠，接过他们的旗帜。"
 mercenary_mutiny_test.12.a.tt: "放弃当前国家，接管这支独立的佣兵军团。"
 STATIC_MODIFIER_NAME_mercenary_mutiny_takeover_aftermath: "佣兵夺舍余波"
 STATIC_MODIFIER_DESC_mercenary_mutiny_takeover_aftermath: "这个国家如今仰仗雇佣兵的刀锋与忠诚。"
 STATIC_MODIFIER_NAME_mercenary_mutiny_split_aftermath: "佣兵分裂余波"
 STATIC_MODIFIER_DESC_mercenary_mutiny_split_aftermath: "国家幸存下来，但在佣兵市场上的声誉已经受损。"
 STATIC_MODIFIER_NAME_mercenary_mutiny_crushed_aftermath: "佣兵叛乱被镇压"
 STATIC_MODIFIER_DESC_mercenary_mutiny_crushed_aftermath: "国家证明自己无法被收买，但佣兵集团不会忘记。"
 STATIC_MODIFIER_NAME_mercenary_mutiny_disloyal_subject: "佣兵军团不忠"
 STATIC_MODIFIER_DESC_mercenary_mutiny_disloyal_subject: "佣兵军团拒绝听从宗主号令，不进贡、不应征，伺机自立门户。"
 STATIC_MODIFIER_NAME_mercenary_mutiny_placated: "佣兵军团被安抚"
