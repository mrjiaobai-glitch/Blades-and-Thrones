 blades_and_thrones_conversion.1.title: "Military Conversions"
 blades_and_thrones_conversion.1.desc: "The realm's military power can be converted between the standing army, mercenaries, territory-free companies, and soldier pops. Choose a conversion; you will then pick the target unit, company, or location.\n\nMonthly pay: [ROOT.GetVariable('blades_and_thrones_pay_cost_display').GetValue|V0]@gold!\nArmy loyalty: [ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]\nSoldier satisfaction: [ROOT.GetVariable('blades_and_thrones_soldier_satisfaction_display').GetValue|V0%]\nMercenary pressure: [ROOT.GetVariable('blades_and_thrones_mercenary_pressure_display').GetValue|V0%]\nJunta stability: [ROOT.GetVariable('blades_and_thrones_junta_stability_display').GetValue|V0]\nMonths at war: [ROOT.GetVariable('blades_and_thrones_war_months_display').GetValue|V0]\nMilitary crisis: [ROOT.GetVariable('blades_and_thrones_military_crisis_display').GetValue|V0]/100\n[ROOT.GetCountry.Custom('blades_and_thrones_crisis_flavor')]"
 blades_and_thrones_conversion.1.a.tt: "Select a hired mercenary company to integrate into the regular army (cost scales with strength). Military crisis decreases."
 blades_and_thrones_conversion.1.b.tt: "Select a regular army to form into a territory-free company (your subject), then choose loyal or independent."
 blades_and_thrones_conversion.1.c.tt: "Reinstate a company: your own expeditionary legion returns for free; a company that went independent after a mutiny settlement must be bought out (10 gold per hundred men) - a one-time buyout of their contract."
 blades_and_thrones_conversion.1.d.tt: "Select a regular army to demobilize into soldier pops (strengthening the soldier estate)."
 mercenary_mutiny_test.1.l.tt: "Open the military conversion menu (integrate mercenaries, reinstate companies, demobilize armies, resettle soldiers)."
 blades_and_thrones_conversion.1.e.tt: "Select a location to convert its soldier pops into peasants (weakening the soldier estate, pleasing the peasants)."
 blades_and_thrones_conversion.1.f.tt: "List a standing army unit for hire to any country within diplomatic range that does not view us with hostility (24-month lease, hired at market price). This is a diplomatic lever: leasing to comrades in arms deepens the alliance (extra opinion); leasing to a country at war with our enemies indirectly checks them, but angers the enemy camp; those who despise us cannot buy our blades. The target receives an offer notice; whether to hire is its own judgment."
 blades_and_thrones_lease.1.title: "Selling Swords: An Army Lease Offer"
 blades_and_thrones_lease.1.desc: "An envoy from [from.GetName] arrives at court with a document: they wish to lease one of your legions for two years, the price already written on the parchment. Lease it out, and the legion fights for them while their treasury pays the wages; keep it, and the swords stay in your own hand. The choice is yours."
