 STATIC_MODIFIER_NAME_mercenary_mutiny_army_country_subsidy: "Hiring Stipend"
 STATIC_MODIFIER_DESC_mercenary_mutiny_army_country_subsidy: "Monthly stipend from the overlord to a lowly mercenary company - mercenaries mainly live by contracts and plunder."
 STATIC_MODIFIER_NAME_mercenary_mutiny_trusted_subsidy: "Military Appropriation"
 STATIC_MODIFIER_DESC_mercenary_mutiny_trusted_subsidy: "Full military appropriation for a trusted state legion - a national army is funded by the state."
 STATIC_MODIFIER_NAME_mercenary_mutiny_veteran_stipend: "Veteran Hiring Stipend"
 STATIC_MODIFIER_DESC_mercenary_mutiny_veteran_stipend: "Contract pay of a powerful mercenary state - veterans cost more."
 STATIC_MODIFIER_NAME_mercenary_mutiny_grand_subsidy: "Grand Legion Appropriation"
 STATIC_MODIFIER_DESC_mercenary_mutiny_grand_subsidy: "Full military appropriation for a grand state legion - the treatment of an elite core."
 mercenary_company: "Free Company"
 mercenary_company_desc: "A territory-free mercenary legion that comes and goes as it pleases - sustained by contracts, plunder and foreign outposts. Nominally subject, in truth a masterless host."
 mercenary_company_trusted: "State Legion"
 mercenary_company_trusted_desc: "A trusted military establishment of the state: it obeys the crown, always joins defensive wars and can be called into offensive ones; it has neither the power nor the will to break away."
 mercenary_company_veteran: "Powerful Mercenary State"
 mercenary_company_veteran_desc: "A veteran mercenary host grown strong: it has the power to leave its overlord, and may turn coat in the overlord's hour of need."
 mercenary_company_grand: "Grand State Legion"
 mercenary_company_grand_desc: "The elite core of the national army: on par with the overlord in strength, able to leave peacefully, but never betraying on the battlefield."
 mercenary_company_warlord: "Local Warlord"
 mercenary_company_warlord_desc: "A legion with lands of its own - nominally subject, in truth independent. It levies its own taxes and heeds no call; when the overlord falters, it may carve out its own domain."
