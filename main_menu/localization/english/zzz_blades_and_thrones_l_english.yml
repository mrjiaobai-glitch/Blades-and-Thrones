 blades_and_thrones_intel.1.desc: "The intelligence service reports on the realm's armed forces and political balance.\n\nMonthly pay: [ROOT.GetVariable('blades_and_thrones_pay_cost_display').GetValue|V0]@gold!\nArmy loyalty: [ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]\nSoldier satisfaction: [ROOT.GetVariable('blades_and_thrones_soldier_satisfaction_display').GetValue|V0%]\nMercenary pressure: [ROOT.GetVariable('blades_and_thrones_mercenary_pressure_display').GetValue|V0%]\nJunta stability: [ROOT.GetVariable('blades_and_thrones_junta_stability_display').GetValue|V0]\nMonths at war: [ROOT.GetVariable('blades_and_thrones_war_months_display').GetValue|V0]\nMilitary crisis: [ROOT.GetVariable('blades_and_thrones_military_crisis_display').GetValue|V0]/100\n[ROOT.GetCountry.Custom('blades_and_thrones_crisis_flavor')]"
