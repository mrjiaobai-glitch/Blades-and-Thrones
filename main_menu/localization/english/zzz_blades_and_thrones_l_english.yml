 blades_and_thrones_company.1.title: "The Company's Fate: Loyalty or Independence?"
 blades_and_thrones_company.1.desc: "The banner is embroidered, the horses saddled - the [Root.GetName] [Root.GetVariable('blades_and_thrones_company_counter').GetValue] Legion is about to take the road. It will leave your direct command and become a territory-free legion marching under your arms. The generals ask: shall this legion stand on loyalty, or be left to its own devices?"
 blades_and_thrones_company.1.a.tt: "The company stays loyal: high loyalty, pays tribute, and never demands pay or plots independence."
 blades_and_thrones_company.1.b.tt: "The company becomes a disloyal subject: refuses levies and tribute, may demand pay, rebel, or even betray you - mercenaries serve only money."
