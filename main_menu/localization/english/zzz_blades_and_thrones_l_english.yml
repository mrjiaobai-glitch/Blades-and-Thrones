 blades_and_thrones_company.1.c.tt: "Abandon your current country and take command of this mercenary company."
 blades_and_thrones_company.1.d: "Convert to a State Legion"
 blades_and_thrones_company.1.d.tt: "The company becomes a trusted military establishment of the state: it obeys the crown, always joins defensive wars and can be called into offensive ones, funded by the royal treasury - but it loses the mercenary's freedom and profit."
