 blades_and_thrones_company.4.title: "The Legion Grows Strong"
 blades_and_thrones_company.4.desc: "Your legion has grown into a mightier form: with strength comes ambition, and the veterans now have the power to leave your service. Their upkeep has risen accordingly."
 blades_and_thrones_company.4.a: "Understood"
 blades_and_thrones_company.5.title: "The Legion Wanes"
 blades_and_thrones_company.5.desc: "Years of attrition have worn the legion down. It has lost the strength to leave your service and fallen back to a smaller, dependent form, and its upkeep has returned to normal."
 blades_and_thrones_company.5.a: "Understood"
 blades_and_thrones_company.6.title: "A Warlord Takes Root"
 blades_and_thrones_company.6.desc: "The legion has gained lands of its own - no longer a wandering host, but a local power. It levies its own taxes, and the crown's word carries little weight on its soil. It still pays nominal homage, but all know it: a warlord has taken root."
 blades_and_thrones_company.6.a: "Understood"
 blades_and_thrones_revoke_warlord_land: "Revoke Warlord Land"
 blades_and_thrones_revoke_warlord_land_desc: "Take back a single territory from a warlord. Only worthwhile for land with meaningful proximity - leave the worthless far-flung holdings to the warlord. Revoking enrages the warlord (loyalty drops sharply); taking away all of its land strips it of its warlord status and reduces it to a landless legion again."
 blades_and_thrones_exchange_warlord_land: "Exchange Land"
 blades_and_thrones_exchange_warlord_land_desc: "Trade one of your own territories for a warlord's - the farther for the nearer. The warlord receives compensation, so the relationship impact is far milder than a direct revocation."
 blades_and_thrones_revoke_no_warlords: "@trigger_no! No warlords whose land could be revoked."
 blades_and_thrones_revoke_no_locations: "@trigger_no! This warlord holds no land to revoke."
 STATIC_MODIFIER_NAME_blades_and_thrones_revoked_land_modifier: "Grudge of the Revoked"
 STATIC_MODIFIER_DESC_blades_and_thrones_revoked_land_modifier: "The crown took back the warlord's land, and the warlord remembers."
 STATIC_MODIFIER_NAME_blades_and_thrones_exchanged_land_modifier: "Aftermath of the Exchange"
 STATIC_MODIFIER_DESC_blades_and_thrones_exchanged_land_modifier: "The crown traded land for the warlord's territory; the warlord grudgingly accepts."
 blades_and_thrones_company.7.title: "The Crown Takes Back"
 blades_and_thrones_company.7.desc: "The crown has taken back a territory from the warlord. On the surface the warlord bows to the decree, but the air in its camp has turned cold - this debt is remembered."
 blades_and_thrones_company.7.a: "Understood"
 blades_and_thrones_company.8.title: "A Warlord Unmade"
 blades_and_thrones_company.8.desc: "The warlord has lost its last territory - an army without land is no longer a lord of the marches. It has fallen back into the ranks of the crown's legions, and its subsidy resumes."
 blades_and_thrones_company.8.a: "Understood"
 blades_and_thrones_company.9.title: "Annual Military Budget"
 blades_and_thrones_company.9.desc: "This year's legion appropriations have been paid out, totalling [ROOT.GetVariable('blades_and_thrones_bill_total').GetValue|V0] gold.\n· Hiring stipends (lowly mercenary companies): [ROOT.GetVariable('blades_and_thrones_bill_level1').GetValue|V0] gold\n· Military appropriations (state legions): [ROOT.GetVariable('blades_and_thrones_bill_level2').GetValue|V0] gold\n· Veteran hiring stipends (powerful mercenary states): [ROOT.GetVariable('blades_and_thrones_bill_level3').GetValue|V0] gold\n· Grand legion appropriations (grand state legions): [ROOT.GetVariable('blades_and_thrones_bill_level4').GetValue|V0] gold"
 blades_and_thrones_company.9.a: "Understood"
 blades_and_thrones_military_coup: "Military Coup"
 blades_and_thrones_military_coup_desc: "When army loyalty collapses, the soldier estate will try to reshape the state by force."
 blades_and_thrones_military_junta_disaster: "Military Junta Rule"
 blades_and_thrones_military_junta_disaster_desc: "A military junta is ruling the state. Its stability depends on legitimacy, war exhaustion, army loyalty, and support from the soldier estate."
 blades_and_thrones_junta_stability_label: "Junta Stability"
 blades_and_thrones_junta_stability_change_label: "Monthly Change"
 blades_and_thrones_junta_change_stability_label: "Base and Stability"
 blades_and_thrones_junta_change_legitimacy_label: "Legitimacy"
 blades_and_thrones_junta_change_loyalty_label: "Army Loyalty"
 blades_and_thrones_junta_change_war_label: "War and Exhaustion"
 blades_and_thrones_junta_threshold_consolidate: "75-100: Consolidate / Voluntary Restoration"
 blades_and_thrones_junta_threshold_restore: "26-45: Forced Restoration if legitimacy is below 30"
 blades_and_thrones_junta_threshold_mid: "46-74: Maintain"
 blades_and_thrones_junta_threshold_crisis: "0-25: Junta Splits"
 blades_and_thrones_junta.1.title: "Banners on the Palace Wall"
 blades_and_thrones_junta.1.desc: "The first company banner now hangs from the palace wall, and the guards are men who keep their hands on their swords. Nobles whisper in the corridors; merchants queue at the counting house - everyone wants a place in the new order.\n\nThe junta's officers are blunt: to hold things together they need silver, support, or a victory big enough to change the subject. They await your answer."
 blades_and_thrones_junta.1.a: "Pay the soldiers"
 blades_and_thrones_junta.1.a.tt: "Pay [ROOT.GetVariable('blades_and_thrones_junta_handout_display').GetValue|V0] gold (six months of wages) to the soldier estate and gain 6 junta stability."
 blades_and_thrones_junta.1.b: "Appease burghers and nobles"
 blades_and_thrones_junta.1.b.tt: "Spend 25% monthly income for legitimacy and stability, but reduce soldier satisfaction."
 blades_and_thrones_junta.1.c: "Suppress dissent"
 blades_and_thrones_junta.1.c.tt: "Spend national stability to gain 10 junta stability and soldier satisfaction."
 blades_and_thrones_junta.1.d: "Administrative reform"
 blades_and_thrones_junta.1.d.tt: "Spend 15% monthly income to improve legitimacy and stability."
 blades_and_thrones_junta.2.title: "Quarrels Among Officers"
 blades_and_thrones_junta.2.desc: "The quarrels in the officers' mess have reached the street. The hardliners want to rule by the sword - more parades, higher pay, fewer civilians; the moderates want to make peace with the old nobility and march the army back to its barracks. Both factions have sent trusted men to sound you out, and the soldiers are waiting to see who wins."
 blades_and_thrones_junta.2.a: "Support the hardliners"
 blades_and_thrones_junta.2.a.tt: "Gain 5 junta stability, lose legitimacy, improve soldier satisfaction, and anger other estates."
 blades_and_thrones_junta.2.b: "Support the moderates"
 blades_and_thrones_junta.2.b.tt: "Lose 4 junta stability, gain legitimacy, improve army loyalty, and reduce soldier satisfaction."
 blades_and_thrones_junta.2.c: "Bet on a faction"
 blades_and_thrones_junta.2.c.tt: "A random faction wins: hardliners grant 8 stability, moderates cost 6 stability."
 blades_and_thrones_junta.99.title: "Junta Stability Debug"
 blades_and_thrones_junta.99.desc: "Quickly adjust military junta stability for testing routes."
 blades_and_thrones_junta.99.a: "+10"
 blades_and_thrones_junta.99.b: "-10"
 blades_and_thrones_junta.99.c: "Set to 75"
 blades_and_thrones_junta.99.d: "Set to 45"
 blades_and_thrones_junta.99.e: "Set to 25"
 blades_and_thrones_military_junta_reform: "Military Junta"
 blades_and_thrones_military_junta_reform_desc: "The soldier estate takes control of the state. Royal and civilian influence declines, other estates are forced to pay heavier taxes, the soldier estate is exempt from taxation, and nationwide rebel growth falls."
 blades_and_thrones_loyalty.4.title: "The Junta Consolidates: Boots in the Chancery"
 blades_and_thrones_loyalty.4.desc: "The voices of opposition have fallen silent. The tread in the corridors has become the rhythm of boots, and the clerks have learned to bow to officers. The junta faces a choice: institutionalize its power so that it endures by right - or keep things as they are, and stake everything on the next victory."
 blades_and_thrones_loyalty.4.a: "Institutionalize military rule"
 blades_and_thrones_loyalty.4.b: "Keep the status quo"
 blades_and_thrones_loyalty.5.title: "Quarrels Among Officers: The Junta Cracks"
 blades_and_thrones_loyalty.5.desc: "Bad war news, an empty treasury, soldiers whispering among themselves - the junta's internal divisions have finally burst open. One faction of officers wants an iron purge of all disloyalty; another wants to bow out gracefully and hand power back. Both watch your decision, and somewhere in the camp, knives are being sharpened."
 blades_and_thrones_loyalty.5.a: "Launch a bloody purge"
 blades_and_thrones_loyalty.5.a.tt: "The purge executes nobles, clergy, and burghers, reducing their population. The soldiers support the purge."
 blades_and_thrones_loyalty.5.b: "Let the junta collapse"
 blades_and_thrones_loyalty.5.c: "Seize power again and harden military rule"
 blades_and_thrones_loyalty.6.title: "The Walls Close In: The Junta Steps Down"
 blades_and_thrones_loyalty.6.desc: "The clamour in the streets grows day by day; the merchants refuse to pay taxes, and even the soldiers voice their discontent in silence. The junta cannot hold on. The officers admit, grim-faced: hand over power with dignity, or be swallowed by the rising tide. Restoring civilian rule is the only honourable way out."
 blades_and_thrones_loyalty.6.a: "Forced peaceful restoration"
 blades_and_thrones_loyalty.6.a.tt: "This restoration leaves no permanent institutional reward, but the junta crisis may return."
 blades_and_thrones_loyalty.6.b: "Refuse to step down"
 blades_and_thrones_loyalty.6.c: "Weak co-governance"
 blades_and_thrones_loyalty.7.title: "The General's Choice: An Honourable Return"
 blades_and_thrones_loyalty.7.desc: "The situation is under control: order restored, the treasury in surplus, the army still loyal. The junta now holds the choice - it can hand power back to the civilians with dignity, earning the name of 'protectors of the realm'; it can share power with the civilians; or it can keep its grip on the state. The generals await your decision."
 blades_and_thrones_loyalty.7.a: "Voluntary peaceful restoration"
 blades_and_thrones_loyalty.7.b: "Voluntary co-governance"
 blades_and_thrones_loyalty.7.c: "Keep military rule"
 STATIC_MODIFIER_NAME_blades_and_thrones_junta_established_modifier: "Institutionalized Junta"
 STATIC_MODIFIER_DESC_blades_and_thrones_junta_established_modifier: "The country has been reshaped into a permanent military system. The military position is secure, but military funding and diplomatic reputation come under pressure."
 STATIC_MODIFIER_NAME_blades_and_thrones_junta_purge_aftermath_modifier: "Aftermath of the Junta Purge"
 STATIC_MODIFIER_DESC_blades_and_thrones_junta_purge_aftermath_modifier: "The officer corps has been purged and military traditions are damaged, but short-term unrest is suppressed."
 STATIC_MODIFIER_NAME_blades_and_thrones_junta_purge_legacy_modifier: "Iron Order After the Purge"
 STATIC_MODIFIER_DESC_blades_and_thrones_junta_purge_legacy_modifier: "The purge ended long-running disorder and restored royal authority and order, though the army remains weakened."
 STATIC_MODIFIER_NAME_blades_and_thrones_junta_collapse_modifier: "Aftermath of the Junta Collapse"
 STATIC_MODIFIER_DESC_blades_and_thrones_junta_collapse_modifier: "The junta has collapsed and the country is in political chaos. Royal and civilian authority is being rebuilt."
 STATIC_MODIFIER_NAME_blades_and_thrones_junta_collapse_legacy_modifier: "National Rebuilding After Collapse"
 STATIC_MODIFIER_DESC_blades_and_thrones_junta_collapse_legacy_modifier: "The country recovers from the collapse of the junta, with stronger civilian authority and cheaper reconstruction."
 STATIC_MODIFIER_NAME_blades_and_thrones_junta_restored_modifier: "Civilian Restoration"
 STATIC_MODIFIER_DESC_blades_and_thrones_junta_restored_modifier: "The junta voluntarily returned power completely. Civilian government rules permanently and the country returns to a normal course."
 STATIC_MODIFIER_NAME_blades_and_thrones_junta_cogovernance_modifier: "Military-Civilian Co-Governance"
 STATIC_MODIFIER_DESC_blades_and_thrones_junta_cogovernance_modifier: "The military shares power from a position of strength. The country stabilizes, but the army keeps political weight at the cost of military funding."
 STATIC_MODIFIER_NAME_blades_and_thrones_junta_restoration_pain_modifier: "Restoration Pain"
 STATIC_MODIFIER_DESC_blades_and_thrones_junta_restoration_pain_modifier: "Sudden junta withdrawal leaves political disorder, making stability investment harder and increasing unrest and legitimacy pressure."
 STATIC_MODIFIER_NAME_blades_and_thrones_junta_forced_cogovernance_modifier: "Weak Co-Governance"
 STATIC_MODIFIER_DESC_blades_and_thrones_junta_forced_cogovernance_modifier: "The military compromised from a weak position, retaining only limited political weight and military funding."
 STATIC_MODIFIER_NAME_blades_and_thrones_junta_hardened_modifier: "Extreme Military Rule"
 STATIC_MODIFIER_DESC_blades_and_thrones_junta_hardened_modifier: "The junta has excluded civilian power through a second coup and fully militarized the state."
 blades_and_thrones_loyalty.8.title: "Night of Mutiny"
 blades_and_thrones_loyalty.8.historical_info: "The tale of hired swords turning on their masters runs through all of history - from the Mercenary War of Carthage to the legions who made emperors. Once the sword becomes a political counterweight, the fate of the throne no longer rests with the crown alone. This mod's military crisis system is a miniature of that law: the army's strength always demands its price when the monarch is weakest."
 blades_and_thrones_loyalty.8.desc.critical: "The camp gates are sealed and the sentries are new faces. After nightfall, squads of soldiers broke into the armory and carried off the matchlocks and powder. The centurions neither stop them nor report them - they are only waiting for an answer.\nCurrent army loyalty: [ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]."
 blades_and_thrones_loyalty.8.desc.low: "At nightfall, scattered shots and shouted commands drift from the camp - not drill commands. Several tents were torn down, the officer on watch was disarmed, and soldiers block the camp gate demanding answers. Mutiny is one spark away.\nCurrent army loyalty: [ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]."
 blades_and_thrones_loyalty.8.desc.base: "Something is wrong in the camp: drills stopped, the kitchens stopped, only the sound of whetstones continues. Old soldiers mutter around the fires while the recruits grip their weapons - they wait not for tomorrow's orders, but for an answer from the throne.\nCurrent army loyalty: [ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]."
 blades_and_thrones_loyalty.8.a: "Pay them off ([ROOT.GetVariable('blades_and_thrones_extra_pay_display').GetValue|V0] gold)"
 blades_and_thrones_loyalty.8.b: "Suppress by force"
 blades_and_thrones_loyalty.8.c: "Let it slide"
 blades_and_thrones_loyalty.1.title: "The Army Is Restless"
 blades_and_thrones_loyalty.1.desc.critical: "Urgent word from the camp: the salutes have stopped. The soldiers look toward the palace the way men look at debtors. Old veterans sharpen their blades at night; new recruits ask whether pay will still come if a new master takes the throne. The first banner may rise before the next full moon.\nCurrent army loyalty: [ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]."
 blades_and_thrones_loyalty.1.desc.low: "The camp is heavy with silence. Men mutter in the pay line: 'The king owes us, and owes us an answer.' A petition from the centurions arrives, worded with respect but stamped with dozens of thumbprints - it reads more like an ultimatum.\nCurrent army loyalty: [ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]."
 blades_and_thrones_loyalty.1.desc.mid: "Rumours spread through the ranks that the crown plans to cut pay to fund a new palace. The soldiers still drill, but their eyes weigh their officers anew. Old captains advise: 'Water the army's spirit before it dries up.'\nCurrent army loyalty: [ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]."
 blades_and_thrones_loyalty.1.desc.base: "Army loyalty is wavering. Far from mutiny, yet the camp grumbles more than usual - arrears, unfair rewards, watered wine. The council notes that matters of military morale are best settled early.\nCurrent army loyalty: [ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]."
 blades_and_thrones_loyalty.1.a: "Pay extra wages"
 blades_and_thrones_loyalty.1.b: "Grant the soldier registry privilege"
 blades_and_thrones_loyalty.1.c: "Refuse firmly"
 blades_and_thrones_loyalty.2.title: "The Army Defends the Throne"
 blades_and_thrones_loyalty.2.desc: "Army loyalty is high. The soldier estate is willing to stand beside the crown in political storms.\nCurrent army loyalty: [ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]."
 blades_and_thrones_loyalty.2.a: "Reward the army"
 blades_and_thrones_loyalty.3.title: "Mutiny: Between Camp and Throne"
 blades_and_thrones_loyalty.3.historical_info: "From the Praetorians changing emperors to governors turning their legions against the capital, the army seizing power is the oldest nightmare of monarchy. The Praetorian Guard of Augustus, the Byzantine theme generals, the Ottoman Janissaries - loyalty of the sword has always gone to the highest bidder. When the soldier estate outweighs the throne, a coup is only a matter of time."
 blades_and_thrones_loyalty.3.desc: "The palace gates are forced open in the dead of night, and the guards are strangers now. The legions march through the square to a slow, steady drum - this is no riot, it is a coup. The officers send a declaration: the army will take charge of the state, and the man at their head will claim the throne, until 'order is restored'.\nCurrent army loyalty: [ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]."
 blades_and_thrones_loyalty.3.a: "Accept military rule"
 blades_and_thrones_loyalty.3.b: "Crush the mutiny"
 blades_and_thrones_loyalty.3.c: "Reach a political compromise"
 zzz_rebalanced_nepal_mercenary_soldiers_estate_regency: "Soldiers Regency"
 zzz_rebalanced_nepal_mercenary_soldiers_estate_regency_desc: "When a country has no ruler, a member of the soldier estate may be assigned to rule it as a regent."
 blades_and_thrones_regency.1.title: "The Price of a Soldier's Regency"
 blades_and_thrones_regency.1.desc: "The regent governs the realm by the rules of the camp: passwords instead of petitions, the parade ground instead of the court. Nobles and clerics mutter in the corridors, burghers fear their ledgers will be turned over by military orders - and in the barracks, the soldiers watch with satisfaction."
 blades_and_thrones_regency.1.a: "Indulge the warlord"
 blades_and_thrones_regency.1.b: "Restrain the regent"
 militarism_vs_civilianism: "Militarism vs Civilianism"
 militarism_vs_civilianism_desc: "The militarist path rules by the sword: army tradition, morale and manpower flourish, and the soldier estate grows strong - along with its political appetite. The civilian path rules by governance: cabinet, research and stability investment lead the way, and the nobility is appeased."
 militarism_focus: "Militarism"
 civilianism_focus: "Civilianism"
 MODIFIER_TYPE_NAME_monthly_towards_militarism: "Monthly Progress towards Militarism"
 MODIFIER_TYPE_DESC_monthly_towards_militarism: "This impacts the change towards the [ShowSocietyDirectionName('militarism')] [societal_values|e]."
 MODIFIER_TYPE_NAME_monthly_towards_civilianism: "Monthly Progress towards Civilianism"
 MODIFIER_TYPE_DESC_monthly_towards_civilianism: "This impacts the change towards the [ShowSocietyDirectionName('civilianism')] [societal_values|e]."
 blades_and_thrones_company_tradition_reform: "Mercenary Tradition"
 blades_and_thrones_company_tradition_reform_desc: "The company takes pride in being mercenaries: cheaper mercenary maintenance, larger mercenary forces and growing army tradition - but the mercenary reputation tarnishes the crown, and the state drifts towards militarism."
 blades_and_thrones_company_regularize_reform: "Regularize the Company"
 blades_and_thrones_company_regularize_reform_desc: "The company cleans up its act and becomes a regular army: discipline and morale are renewed, maintenance is more efficient - but the mercenary network's discounts are lost, hiring mercenaries becomes costlier, and the state drifts towards civilianism."
 blades_and_thrones_company_looting_reform: "Looting Doctrine"
 blades_and_thrones_company_looting_reform_desc: "War pays for itself: loot gains are greatly increased - but years of pillaging keep the state on edge, tarnish its reputation, and make it ever more belligerent abroad."
 blades_and_thrones_regency.2.title: "Refusing to Step Down"
 blades_and_thrones_regency.2.desc: "The young heir has come of age, yet the regent shows no intention of handing over power. In the barracks they whisper: 'The throne needs a man who knows how to hold a sword.' If the regent refuses to yield, the realm will slide toward mutiny - and the army is already prepared."
 blades_and_thrones_regency.2.a: "Demand the return of power"
 blades_and_thrones_regency.2.b: "Let it be (the regent refuses to yield)"
 STATIC_MODIFIER_NAME_blades_and_thrones_military_junta_modifier: "A Military Junta Rules"
 STATIC_MODIFIER_DESC_blades_and_thrones_military_junta_modifier: "The soldier estate controls the state and royal authority is weakened; the effect fades over time."
 STATIC_MODIFIER_NAME_blades_and_thrones_army_purged_modifier: "Aftermath of the Army Purge"
 STATIC_MODIFIER_DESC_blades_and_thrones_army_purged_modifier: "The crown purged unreliable officers, but military morale and tradition have suffered; the effect fades over time."
 STATIC_MODIFIER_NAME_blades_and_thrones_military_compromise_modifier: "Military Compromise"
 STATIC_MODIFIER_DESC_blades_and_thrones_military_compromise_modifier: "The crown has made a political bargain with the army, granting the soldier estate greater political weight; the effect fades over time."
 blades_and_thrones_war.1.title: "Triumph: The Victorious Army Returns"
 blades_and_thrones_war.1.desc: "The gates swing wide as the victorious legions march in bearing captured banners; the crowd throws flowers, and the bells ring across the city. But victory brings its own questions: the soldiers wait for their reward, and the officers are already counting how much power their deeds should buy. Every cup raised at the victory feast carries a private calculation.\nArmy loyalty: [ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]."
 blades_and_thrones_war.1.a: "Reward the army"
 blades_and_thrones_war.1.a.tt: "Pay [ROOT.GetVariable('blades_and_thrones_triple_pay_display').GetValue|V0] gold (three months of wages) to the soldier estate, improve soldier satisfaction, and gain 4 junta stability."
 blades_and_thrones_war.1.b: "Reward merit and expand military power"
 blades_and_thrones_war.1.b.tt: "Lose legitimacy, improve soldier satisfaction, and gain 6 junta stability."
 blades_and_thrones_war.1.c: "Return in triumph"
 blades_and_thrones_war.1.c.tt: "Gain legitimacy and national stability, reduce soldier satisfaction, and lose 3 junta stability."
 blades_and_thrones_war.1.d: "Keep it low-key"
 blades_and_thrones_war.1.d.tt: "Gain a small amount of prestige and soldier satisfaction without changing the junta balance."
 blades_and_thrones_war.2.title: "The Defeated Army: Reckoning and Blame"
 blades_and_thrones_war.2.desc: "The broken army limps back through the gates under tattered banners; there are no flowers at the gate, only silence. The officers blame each other, and your political enemies are already drafting their accusations. Everyone needs an explanation - or, failing that, a scapegoat.\nArmy loyalty: [ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]."
 blades_and_thrones_war.2.a: "Reform and rearm"
 blades_and_thrones_war.2.a.tt: "Pay [ROOT.GetVariable('blades_and_thrones_triple_pay_display').GetValue|V0] gold (three months of wages) to the soldier estate, improve soldier satisfaction, gain 3 junta stability, and remove the shame of defeat."
 blades_and_thrones_war.2.b: "Purge the generals"
 blades_and_thrones_war.2.b.tt: "Lose legitimacy, sharply reduce soldier satisfaction, purge the army, gain 5 junta stability, and remove the shame of defeat."
 blades_and_thrones_war.2.c: "Civilian cleanup"
 blades_and_thrones_war.2.c.tt: "Gain a little legitimacy, lose national stability and soldier satisfaction, lose 2 junta stability, and remove the shame of defeat."
 blades_and_thrones_war.2.d: "Accept the defeat"
 blades_and_thrones_war.2.d.tt: "Lose legitimacy, national stability, and soldier satisfaction, lose 4 junta stability, and keep the shame pressing down on army loyalty."
