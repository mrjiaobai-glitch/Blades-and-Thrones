 MODIFIER_TYPE_NAME_zzz_rebalanced_nepal_mercenary_soldiers_estate_satisfaction_recovery: "Soldier Estate Satisfaction Recovery"
 MODIFIER_TYPE_DESC_zzz_rebalanced_nepal_mercenary_soldiers_estate_satisfaction_recovery: "This impacts how quickly the [estate_satisfaction|e] recovers to the [estate_satisfaction_equilibrium|e] for the $zzz_rebalanced_nepal_mercenary_soldiers_estate$ in this [country|e]."
 MODIFIER_TYPE_NAME_zzz_rebalanced_nepal_mercenary_soldiers_estate_satisfaction_decay: "Soldier Estate Satisfaction Decay"
 MODIFIER_TYPE_DESC_zzz_rebalanced_nepal_mercenary_soldiers_estate_satisfaction_decay: "This impacts how quickly the [estate_satisfaction|e] decays down to the [estate_satisfaction_equilibrium|e] for the $zzz_rebalanced_nepal_mercenary_soldiers_estate$ in this [country|e]."
 MODIFIER_TYPE_NAME_zzz_rebalanced_nepal_mercenary_soldiers_estate_max_tax: "Maximum Tax for Soldier Estate"
 MODIFIER_TYPE_DESC_zzz_rebalanced_nepal_mercenary_soldiers_estate_max_tax: "This impacts the [maximum_tax|e] that can be collected from the $zzz_rebalanced_nepal_mercenary_soldiers_estate$."
 MODIFIER_TYPE_NAME_zzz_rebalanced_nepal_mercenary_soldiers_estate_min_tax: "Minimum Tax for Soldier Estate"
 MODIFIER_TYPE_DESC_zzz_rebalanced_nepal_mercenary_soldiers_estate_min_tax: "This impacts the [minimum_tax|e] that can be collected from the $zzz_rebalanced_nepal_mercenary_soldiers_estate$."
 MODIFIER_TYPE_NAME_zzz_rebalanced_nepal_mercenary_soldiers_estate_levy_size: "Soldier Estate Levy Size"
 MODIFIER_TYPE_DESC_zzz_rebalanced_nepal_mercenary_soldiers_estate_levy_size: "This impacts the size of [army_levies|e] and [navy_levies|e] from the $zzz_rebalanced_nepal_mercenary_soldiers_estate$."
 MODIFIER_TYPE_NAME_local_zzz_rebalanced_nepal_mercenary_soldiers_estate_power: "Local Soldier Estate Power"
 MODIFIER_TYPE_DESC_local_zzz_rebalanced_nepal_mercenary_soldiers_estate_power: "This impacts the [estate_power|e] of the $zzz_rebalanced_nepal_mercenary_soldiers_estate$ in this [location|e]."
 MODIFIER_TYPE_NAME_global_zzz_rebalanced_nepal_mercenary_soldiers_estate_power: "Soldier Estate Power"
 MODIFIER_TYPE_DESC_global_zzz_rebalanced_nepal_mercenary_soldiers_estate_power: "This impacts the [estate_power|e] of the $zzz_rebalanced_nepal_mercenary_soldiers_estate$ in the entire [country|e]."
 MODIFIER_TYPE_NAME_base_zzz_rebalanced_nepal_mercenary_soldiers_estate_power_modifier: "Base Soldier Estate Power"
 MODIFIER_TYPE_DESC_base_zzz_rebalanced_nepal_mercenary_soldiers_estate_power_modifier: "This modifies the base [political_power|e] from [pops|e] of the $zzz_rebalanced_nepal_mercenary_soldiers_estate$ in the entire [country|e]."
 MODIFIER_TYPE_NAME_local_zzz_rebalanced_nepal_mercenary_soldiers_estate_unrest: "[ShowEstateTypeName('zzz_rebalanced_nepal_mercenary_soldiers_estate')] Unrest"
 MODIFIER_TYPE_DESC_local_zzz_rebalanced_nepal_mercenary_soldiers_estate_unrest: "This impacts the [unrest|e] of the [ShowEstateTypeName('zzz_rebalanced_nepal_mercenary_soldiers_estate')] in a [location|e]."
 MODIFIER_TYPE_NAME_zzz_rebalanced_nepal_mercenary_soldiers_estate_cannot_marry: "Soldiers Cannot Marry"
 MODIFIER_TYPE_DESC_zzz_rebalanced_nepal_mercenary_soldiers_estate_cannot_marry: "This tells us if members of this estate cannot marry."
 MODIFIER_TYPE_NAME_zzz_rebalanced_nepal_mercenary_soldiers_estate_can_participate_in_parliament: "$zzz_rebalanced_nepal_mercenary_soldiers_estate$ in Parliament"
 MODIFIER_TYPE_DESC_zzz_rebalanced_nepal_mercenary_soldiers_estate_can_participate_in_parliament: "This allows the $zzz_rebalanced_nepal_mercenary_soldiers_estate$ to suggest [parliament_agendas|e]."
 MODIFIER_TYPE_NAME_zzz_rebalanced_nepal_mercenary_soldiers_estate_blocked_from_parliament: "No $zzz_rebalanced_nepal_mercenary_soldiers_estate$ in Parliament"
 MODIFIER_TYPE_DESC_zzz_rebalanced_nepal_mercenary_soldiers_estate_blocked_from_parliament: "This blocks the $zzz_rebalanced_nepal_mercenary_soldiers_estate$ from participating in the [parliament|e]."
 MODIFIER_TYPE_NAME_zzz_rebalanced_nepal_mercenary_soldiers_estate_agenda_impact: "Agenda Impact for $zzz_rebalanced_nepal_mercenary_soldiers_estate$"
 MODIFIER_TYPE_DESC_zzz_rebalanced_nepal_mercenary_soldiers_estate_agenda_impact: "This modifies the support that the [parliament_agendas|e] proposed from the $zzz_rebalanced_nepal_mercenary_soldiers_estate$ has."
 MODIFIER_TYPE_NAME_zzz_rebalanced_nepal_mercenary_soldiers_estate_blocked_from_cabinet: "$zzz_rebalanced_nepal_mercenary_soldiers_estate$ Blocked from Cabinet"
 MODIFIER_TYPE_DESC_zzz_rebalanced_nepal_mercenary_soldiers_estate_blocked_from_cabinet: "This forbids [characters|e] from the [ShowEstateTypeName('zzz_rebalanced_nepal_mercenary_soldiers_estate')] [estate|e] to be employed in the [cabinet|e]."
 MODIFIER_TYPE_NAME_zzz_rebalanced_nepal_mercenary_soldiers_estate_allowed_in_cabinet: "$zzz_rebalanced_nepal_mercenary_soldiers_estate$ Allowed in Cabinet"
 MODIFIER_TYPE_DESC_zzz_rebalanced_nepal_mercenary_soldiers_estate_allowed_in_cabinet: "This allows [characters|e] from the [ShowEstateTypeName('zzz_rebalanced_nepal_mercenary_soldiers_estate')] [estate|e] to be employed in the [cabinet|e]."
 MODIFIER_TYPE_NAME_zzz_rebalanced_nepal_mercenary_soldiers_estate_allowed_to_build_roads: "$zzz_rebalanced_nepal_mercenary_soldiers_estate$ Allowed to Build Roads"
 MODIFIER_TYPE_DESC_zzz_rebalanced_nepal_mercenary_soldiers_estate_allowed_to_build_roads: "This allows the $zzz_rebalanced_nepal_mercenary_soldiers_estate$ to begin construction of [roads|e]."
 MODIFIER_TYPE_NAME_zzz_rebalanced_nepal_mercenary_soldiers_estate_allowed_to_build_rgo: "$zzz_rebalanced_nepal_mercenary_soldiers_estate$ Allowed to Expand $game_concept_rgo$"
 MODIFIER_TYPE_DESC_zzz_rebalanced_nepal_mercenary_soldiers_estate_allowed_to_build_rgo: "This allows the $zzz_rebalanced_nepal_mercenary_soldiers_estate$ to begin construction of [rgo|e]."
 MODIFIER_TYPE_NAME_zzz_rebalanced_nepal_mercenary_soldiers_estate_blocked_from_leading_military: "$zzz_rebalanced_nepal_mercenary_soldiers_estate$ Blocked from Command"
