 blades_and_thrones_militia_autonomy: "Militia Autonomy"
 blades_and_thrones_militia_autonomy_desc: "The crown permits local soldiers to organize and raise militia training grounds on their own. The soldier estate gains the organizational power to expand its own manpower, but the crown's monopoly on violence loosens. While granted, the soldier estate may build militia training grounds in any location; revoking it halts new construction."
 blades_and_thrones_militia_training_ground: "Militia Training Ground"
 blades_and_thrones_militia_training_ground_desc: "A compound where local soldiers drill and organize on their own, strengthening the soldier estate's power and local manpower at the cost of higher local soldier food consumption."
 blades_and_thrones_militia_training_ground_stats_tt: "#T Militia Training Ground (single level, built by the soldier estate)#!\n· Local soldier estate power +0.05\n· Local manpower modifier +5%\n· Local levy size +10%\n· Local soldier food consumption +10% (cost)\n· Buildable in rural settlements, towns, cities and metropolises"
 blades_and_thrones_militia.99.title: "Militia Debug"
 blades_and_thrones_militia.99.desc: "Militia training ground test tool: grant or revoke Militia Autonomy, fund the soldier estate, or force-build a training ground in the capital (to verify building definitions, maintenance, and modifier display without waiting for the estate AI)."
 MODIFIER_TYPE_NAME_allow_blades_and_thrones_militia_training_ground: "Allows Militia Training Grounds"
 MODIFIER_TYPE_DESC_allow_blades_and_thrones_militia_training_ground: "While this permission exists, the soldier estate may build militia training grounds in any location; revoking it halts new construction."
 AUTO_MODIFIER_NAME_blades_and_thrones_era_levy_early: "Levy State - Golden Age"
 AUTO_MODIFIER_DESC_blades_and_thrones_era_levy_early: "Through the Traditions, Renaissance, and Discovery eras levies and local militia are at their peak: larger levy sizes and manpower, better maintenance efficiency."
 AUTO_MODIFIER_NAME_blades_and_thrones_era_levy_late: "Levy State - Outdated"
 AUTO_MODIFIER_DESC_blades_and_thrones_era_levy_late: "From the Reformation era on, gunpowder and line tactics leave levies behind: discipline and morale fall."
 AUTO_MODIFIER_NAME_blades_and_thrones_era_standing_early: "Standing Army - Inefficient"
 AUTO_MODIFIER_DESC_blades_and_thrones_era_standing_early: "Through the Traditions, Renaissance, and Discovery eras standing armies are costly and clumsy: maintenance efficiency falls."
 AUTO_MODIFIER_NAME_blades_and_thrones_era_standing_late: "Standing Army - Ascendant"
 AUTO_MODIFIER_DESC_blades_and_thrones_era_standing_late: "From the Reformation era on, the military revolution makes professional standing armies rule the battlefield: discipline, morale, and maintenance efficiency rise."
 AUTO_MODIFIER_NAME_blades_and_thrones_era_mercenary_early: "Mercenary League - Golden Age"
 AUTO_MODIFIER_DESC_blades_and_thrones_era_mercenary_early: "Through the Traditions, Renaissance, and Discovery eras, the golden age of mercenaries: lower hire premiums and cheaper mercenary maintenance."
 AUTO_MODIFIER_NAME_blades_and_thrones_era_mercenary_late: "Mercenary League - Declining"
 AUTO_MODIFIER_DESC_blades_and_thrones_era_mercenary_late: "From the Reformation era on, national armies replace mercenaries: hire premiums rise and available mercenaries shrink."
 AUTO_MODIFIER_NAME_blades_and_thrones_era_mixed_late: "Mixed Military - Steady Gains"
 AUTO_MODIFIER_DESC_blades_and_thrones_era_mixed_late: "From the Reformation era on, a balanced mixed military benefits steadily from the military revolution: small discipline and morale gains."
 cb_blades_and_thrones_expel_landless: "Expel the Landless Legion"
 cb_blades_and_thrones_expel_landless_desc: "A landless wandering army camps in our territory. They will leave - or they will be destroyed."
 cb_blades_and_thrones_restoration: "Restore the Homeland"
 cb_blades_and_thrones_restoration_desc: "Our former capital lies in enemy hands. Take it back and restore our nation!"
 EXPEL_LANDLESS_WAR_NAME: "War to Expel the Landless"
 RESTORATION_WAR_NAME: "War of Restoration"
 blades_and_thrones_landless.1.title: "Pitching Camp: The End of Exile"
 blades_and_thrones_landless.1.desc: "The banner is planted on soil that is finally our own. The veterans set down their packs and gaze at the place that will be called 'home' - some are already planning the walls, others pondering next year's harvest. The exile is over, but the true test is just beginning: governance, taxes, and neighbours who watch us warily."
 blades_and_thrones_landless.1.a.tt: "Settle here: end the exile identity and become a territorial military state (keeping military traditions)."
 blades_and_thrones_landless.1.b.tt: "Keep wandering: do not establish a base for now (the land remains yours)."
 blades_and_thrones_landless.2.title: "Swords and Hunger: The Day the Grain Runs Out"
 blades_and_thrones_landless.2.desc: "The supply wagons have not come for three days. The soldiers sit around empty pots, their eyes moving between the fields beyond the camp and the articles of war. An old veteran puts it plainly: 'Swords can buy grain, but they can also buy the gallows.' The hungry legion needs a decision."
 blades_and_thrones_landless.2.a.tt: "Plunder: gain [ROOT.GetVariable('blades_and_thrones_plunder_display').GetValue|V0] gold, lose stability, please the soldiers."
 blades_and_thrones_landless.2.b.tt: "Keep discipline: no plunder, slight soldier discontent."
 blades_and_thrones_landless.3.title: "Return to the Capital: The Throne Calls"
 blades_and_thrones_landless.3.desc: "The gates of the old capital stand open before us, still scarred by the siege of years past. Old folk recognise the legion's faded banner; some kneel by the roadside and weep. The throne is there, covered in dust, waiting for its master. The exile is over - now, rebuild the nation."
 blades_and_thrones_landless.3.a.tt: "Restore the homeland: end the exile identity, gain the permanent 'Restorer' modifier, and a large legitimacy boost."
 blades_and_thrones_grant_settlement: "Grant Settlement"
 blades_and_thrones_grant_settlement_desc: "Gift a territory to landless exiles so they can settle down - once they hold land they will shed their exile status on their own."
 blades_and_thrones_claim_foothold: "Claim a Foothold"
 blades_and_thrones_claim_foothold_desc: "Found a state by the sword: pick a land - owned land (heathen/foreign culture) means immediate conquest war; unowned land (such as the New World) is occupied directly. With land in hand you can settle and legitimize."
 blades_and_thrones_lease_army: "Lease Army"
 blades_and_thrones_lease_army_desc: "List a standing army for hire to any country within diplomatic range that does not view us with hostility (24-month lease, hired at market price, returned automatically on expiry)."
