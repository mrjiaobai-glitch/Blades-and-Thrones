 STATIC_MODIFIER_DESC_blades_and_thrones_settled_military_modifier: "From mercenaries to lords: army tradition grows, manpower and recruitment improve."
 STATIC_MODIFIER_NAME_blades_and_thrones_restored_country_modifier: "The Restorer"
 STATIC_MODIFIER_DESC_blades_and_thrones_restored_country_modifier: "Exiles who reclaimed their capital: legitimacy recovers slowly, army tradition grows, diplomatic reputation improves."
 AUTO_MODIFIER_NAME_blades_and_thrones_landless_looter: "Landless Raiders"
 AUTO_MODIFIER_DESC_blades_and_thrones_landless_looter: "Wandering legions live by the sword: loot gains increased."
