 blades_and_thrones_conversion.1.h.tt: "Found a kingdom with the sword: pick a land - declare war on heathen owners at once, or settle vacant land (like the New World) directly. Holding land lets you settle and become a regular state."
 blades_and_thrones_opinion_betrayed: "Betrayal"
 blades_and_thrones_rogue_company_name: "Free Legion"
 blades_and_thrones_rogue_company_name_ADJ: "Free"
 BLT: "Free Legion"
 BLT_ADJ: "Free"
 blades_and_thrones_food_access_reform: "A Home Everywhere"
 blades_and_thrones_food_access_reform_desc: "The legion is at home everywhere - it may buy food on the lands where it stays, and automatically gains passage through every country's borders. Wherever it roams, its army finds food and open roads."
 blades_and_thrones_food_access_tt: "While the army stays in foreign territory, a food access relation is automatically established with the local owner; military access is likewise granted by all non-belligerent countries within diplomatic range."
 blades_and_thrones_loyalty.1.b.tt: "Grant the soldier estate the 'Military Registry' privilege: soldier satisfaction rises, but so does their power."
 blades_and_thrones_loyalty.1.c.tt: "Refuse firmly: stability drops, the soldier estate is gravely displeased - loyalty will keep deteriorating."
 blades_and_thrones_loyalty.2.a.tt: "High army loyalty: reward the troops, soldier estate pleased, prestige rises."
 blades_and_thrones_loyalty.3.a.tt: "Accept military takeover: the junta takes power, a soldier becomes ruler, the troops rejoice (stability drops slightly)."
 blades_and_thrones_loyalty.3.b.tt: "Suppress the coup: slight stability loss, prestige gain, but the soldier estate is gravely displeased - the grudge invites a swifter next coup."
 blades_and_thrones_loyalty.3.c.tt: "Political compromise: a 10-year 'Military Compromise' with the army - stability and soldier satisfaction rise, but the military gains power."
 blades_and_thrones_loyalty.4.a.tt: "Institutionalize military rule: permanent 'Junta Established' modifier (army tradition, manpower, military efficiency), prestige and soldier satisfaction rise."
 blades_and_thrones_loyalty.4.b.tt: "Maintain the status quo: keep ruling as a junta and see what unfolds."
 blades_and_thrones_loyalty.5.b.tt: "Junta collapse: restore the crown, gain 10-year 'Collapse Aftermath', severe stability loss."
 blades_and_thrones_loyalty.5.c.tt: "Second coup: purge civilian power entirely, gain permanent 'Extreme Military Rule', the troops rejoice."
 blades_and_thrones_loyalty.6.b.tt: "Refuse restoration: slight stability loss, soldiers pleased - but the regime's legitimacy keeps eroding."
 blades_and_thrones_loyalty.6.c.tt: "Military-civil co-governance: the army keeps some power, gain 'Forced Co-governance', legitimacy and estate relations improve."
 blades_and_thrones_loyalty.7.a.tt: "Peaceful restoration: permanent 'Restorer' modifier, legitimacy greatly restored, stability up - but the dispossessed military nurses a grudge (restoration unrest for 12 months)."
 blades_and_thrones_loyalty.7.b.tt: "Military-civil co-governance: the army retains a political role, gain 'Co-governance', legitimacy and stability recover slightly."
 blades_and_thrones_loyalty.7.c.tt: "Delay restoration: keep ruling 36 more months, then reconsider; slight stability gain."
 blades_and_thrones_loyalty.8.a.tt: "Pay them off: spend [ROOT.GetVariable('blades_and_thrones_extra_pay_display').GetValue|V0] gold to settle the mutiny - the army is pleased, but the crown shows weakness (stability, legitimacy dip)."
 blades_and_thrones_loyalty.8.b.tt: "Suppress by force: quell it now (prestige up, stability down), but soldier satisfaction plummets and the military nurses a 24-month grudge - the coup threshold is relaxed."
 blades_and_thrones_loyalty.8.c.tt: "Let it slide: the soldiers grow bolder, loyalty and stability keep deteriorating - the mutiny is only the beginning."
 blades_and_thrones_regency.1.a.tt: "Let the soldier regent rule: sacrifice noble, clergy and burgher interests for army tradition."
 blades_and_thrones_regency.1.b.tt: "Rein in the soldier regent: the soldier estate is displeased, but the other estates are reassured."
 blades_and_thrones_regency.2.a.tt: "Peaceful restoration: stability up, soldier estate displeased."
 blades_and_thrones_regency.2.b.tt: "Refuse to step down (extend the regency by 10 years): legitimacy suffers - the soldier regency will trigger the coup path."
