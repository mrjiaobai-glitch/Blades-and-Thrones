 ai_warlord: "Warlord"
 ai_warlord_desc: "This country is bellicose and self-serving, prizing land and armed might above all - a true warlord, heedless of stability and diplomacy."
 ai_mercenary_company: "Mercenary Company"
 ai_mercenary_company_desc: "This country is a band of hired swords: gold and manpower come first, loyalty and diplomacy are commodities with a price - whoever pays enough can turn yesterday's enemy into tomorrow's ally."
 ai_trusted_company: "Trusted Legion"
 ai_trusted_company_desc: "This country is the state's standing army in trust: loyal, disciplined and vigilant in defence, seeing itself as part of the national armed forces - it does not pick fights, but guards its lands without hesitation."
