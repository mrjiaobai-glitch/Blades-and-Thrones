 blades_and_thrones_veterans.1.title: "The Veterans Return Home"
 blades_and_thrones_veterans.1.desc: "The war is over and the horns have faded. In the camps the veterans pack their bags - some want to till the soil again, some know no trade but war, and some think another campaign would be the best retirement. The soldier estate watches the treasury, waiting for the crown to settle accounts with its heroes.\n\nWhatever the crown decides, the dismissed soldiers will drift back to the fields over the coming months - it is easy to sheathe a sword, but harder to teach a hand that held one to hold a plough again.\nCurrent soldier strength: [ROOT.GetVariable('blades_and_thrones_veteran_soldier_size').GetValue|V0]."
 blades_and_thrones_veterans.1.a: "Pay severance and send them home"
 blades_and_thrones_veterans.1.a.tt: "Pay [ROOT.GetVariable('blades_and_thrones_veteran_severance_display').GetValue|V0] gold as severance, cutting 30% of soldier pops (back to the land). The remaining surplus soldiers drift back to the land over 2 years (soldier desired pop -10%). Soldier estate satisfaction rises; small stability bonus."
 blades_and_thrones_veterans.1.b: "Dismiss without pay"
 blades_and_thrones_veterans.1.b.tt: "Pay no severance and cut 30% of soldier pops; the remaining surplus soldiers drift back to the land over 2 years. Gain the 'Veteran Unrest' modifier (3 years): manpower -5%, soldier rebel growth up, army loyalty under pressure. Soldier estate satisfaction falls."
 blades_and_thrones_veterans.1.c: "Keep the veterans as a standing core"
 blades_and_thrones_veterans.1.c.tt: "No demobilization; soldier pops remain. Gain the 'Veteran Core' modifier (10 years): army tradition +0.05/month, discipline +2.5%, morale +5%, but maintenance +5%. Small legitimacy bonus."
 blades_and_thrones_veterans.1.d: "Leave it for now"
 blades_and_thrones_veterans.1.d.tt: "Keep things as they are and postpone the decision."
 blades_and_thrones_veterans.2.title: "Veteran Unrest"
 blades_and_thrones_veterans.2.desc: "The veterans denied their severance have not gone home. They gather in the old camp outside the walls, passing time with war stories and complaints about the crown. In the taverns their words spread: 'We bled for them, and they would not spare a coin.' Lately, men have seen them sharpening blades at night."
 blades_and_thrones_veterans.2.a: "Pay the severance after all"
 blades_and_thrones_veterans.2.a.tt: "Pay 200 gold as back severance to soothe the veterans (removes 'Veteran Unrest'). Soldier estate satisfaction rises."
 blades_and_thrones_veterans.2.b: "Suppress them by force"
 blades_and_thrones_veterans.2.b.tt: "Suppress the unrest (removes 'Veteran Unrest'), but gain 'Veteran Suppressed' (2 years): manpower -5%, soldier rebel growth up, legitimacy -0.01/month. Small stability penalty."
 blades_and_thrones_veterans.2.c: "Ignore them"
 blades_and_thrones_veterans.2.c.tt: "Let them fester: 'Veteran Unrest' continues, but no cost now."
 blades_and_thrones_veterans.3.title: "The Fate of the Veterans"
 blades_and_thrones_veterans.3.desc: "Year after year of peace, and the veteran core still keeps its drill - assembly before dawn, ranks unmoved by weather. They are the sharpest blade in the arsenal, but a blade left idle will rust. The generals ask: shall this veteran host be folded into the standing army as the spine of the realm, or disbanded, its legend left to the taverns?"
 blades_and_thrones_veterans.3.a: "Fold them into the standing army"
 blades_and_thrones_veterans.3.a.tt: "The veterans join the standing army (removes 'Veteran Core'), gaining 'Institutionalized Veterans' (20 years): army tradition +0.03/month, discipline +1.5%, maintenance efficiency +3%. Soldier estate satisfaction rises."
 blades_and_thrones_veterans.3.b: "Keep the veteran core"
 blades_and_thrones_veterans.3.b.tt: "Keep the 'Veteran Core' modifier; revisit in two years."
 blades_and_thrones_veterans.3.c: "Disband the veterans"
 blades_and_thrones_veterans.3.c.tt: "Disband them (removes 'Veteran Core'), saving maintenance; small stability bonus."
