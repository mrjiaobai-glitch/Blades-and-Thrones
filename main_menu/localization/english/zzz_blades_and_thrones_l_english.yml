l_english:

 mercenary_mutiny: "Mercenary Mutiny"
 blades_and_thrones_military_doctrine_law: "Military and the State"
 blades_and_thrones_military_doctrine_law_desc: "Where armies come from and whom they obey decides whether the blade serves the throne, an estate, or gold.\nCurrent army loyalty: [ROOT.GetVariable('blades_and_thrones_army_loyalty_display').GetValue|V0%]."
 standing_army_state_policy: "Standing Army State"
 standing_army_state_policy_desc: "Maintain a standing army paid and commanded by the crown. The soldier estate becomes an arm of royal power, but pay and loyalty directly affect the state. A loyal army becomes a pillar of the throne; collapsing loyalty sharply raises coup risk."
 mercenary_league_policy: "Mercenary League"
 mercenary_league_policy_desc: "Reduce the standing army and outsource war to mercenary companies. Merchants and mercenaries profit while the soldier estate and the crown lose their monopoly on violence. Soldier coup risk falls, but mercenary pressure and takeover risk rise."
 mixed_military_policy: "Mixed Military"
 mixed_military_policy_desc: "Keep standing troops, levies, and mercenaries in balance, trading some efficiency for lower political risk. Loyalty and coup risk remain moderate."
 levy_state_policy: "Levy State"
 levy_state_policy_desc: "Rely on noble and peasant levies. The army costs less, but the soldier estate struggles to become an independent political force. Soldier influence and coup risk are both low."
 zzz_rebalanced_nepal_mercenary_soldiers_estate: "Soldiers"
 zzz_rebalanced_nepal_mercenary_soldiers_estate_desc: "This estate represents the warriors of our country, including professional soldiers, mercenaries, and officers. Their traditional responsibility is to protect the realm and carry out the state's armed will, and their power comes from numbers, discipline, and the profession of arms rather than birth or wealth.\n$estate_common_crown_ending$"
 zzz_mercenary_mutiny_soldiers_military_register: "Soldier Registry"
 zzz_mercenary_mutiny_soldiers_military_register_desc: "Register professional soldiers with the state and formalize their service and pay obligations. Pay applies to soldiers on the standing-army rolls; those levied into local militia serve as conscripts supplied through maintenance, outside the pay roster."
 zzz_mercenary_mutiny_soldiers_professional_officer_corps: "Professional Officer Corps"
 zzz_mercenary_mutiny_soldiers_professional_officer_corps_desc: "Establish a promotion system based on merit and rank, improving the professionalism of the army."
 zzz_mercenary_mutiny_soldiers_state_mercenary_contracts: "State Mercenary Contracts"
 zzz_mercenary_mutiny_soldiers_state_mercenary_contracts_desc: "Let the soldier estate arrange mercenary contracts, expanding the pool of experienced troops available to the state."
 zzz_mercenary_mutiny_soldiers_military_courts: "Military Jurisdiction"
 zzz_mercenary_mutiny_soldiers_military_courts_desc: "Soldiers are tried under military law, improving discipline but making the military more independent."
 zzz_mercenary_mutiny_soldiers_standing_army: "Standing Army Pay"
 zzz_mercenary_mutiny_soldiers_standing_army_desc: "Guarantee regular pay and barracks supplies for professional soldiers, keeping the army ready for war."
 zzz_mercenary_mutiny_soldiers_old_soldiers_council: "Council of Old Soldiers"
 zzz_mercenary_mutiny_soldiers_old_soldiers_council_desc: "Retired officers advise on war and defense, sharing in national decision-making."
 zzz_mercenary_mutiny_soldiers_idle_production: "Allow Military Idle Production"
 zzz_mercenary_mutiny_soldiers_idle_production_desc: "Soldiers work and expand resource operations between campaigns, making the estate richer and more stable at the cost of drill time."
 zzz_mercenary_mutiny_soldiers_farmer_supply_train: "Pressed Farmer Supply Trains"
 zzz_mercenary_mutiny_soldiers_farmer_supply_train_desc: "The army presses peasants into service as supply trains when needed, extending logistics reach at the cost of peasant loyalty."
 zzz_rebalanced_nepal_mercenary_soldiers_royal_hand: "Royal Hand"
 zzz_rebalanced_nepal_mercenary_soldiers_royal_hand_desc: "The crown authorizes the soldier estate to keep order and suppress the other estates. Soldiers gain more power, but if their loyalty falters, this army becomes the crown's most dangerous threat."
 AUTO_MODIFIER_NAME_zzz_rebalanced_nepal_mercenary_soldiers_royal_hand_disloyal: "Royal Hand Gone Rogue"
 AUTO_MODIFIER_DESC_zzz_rebalanced_nepal_mercenary_soldiers_royal_hand_disloyal: "The soldier estate is dissatisfied with the crown. Royal suppression fails and the army begins to drift toward rebellion."
 AUTO_MODIFIER_NAME_zzz_mercenary_mutiny_soldier_pay_redirect: "Soldier Pay Redirect"
 AUTO_MODIFIER_DESC_zzz_mercenary_mutiny_soldier_pay_redirect: "The treasury pays the soldier estate a fixed monthly wage. Pay is an independent cash obligation, separate from maintenance - maintenance covers supplies and equipment, while pay is issued per soldier on the rolls."
 AUTO_MODIFIER_NAME_blades_and_thrones_army_loyalty_display: "Current Army Loyalty"
 AUTO_MODIFIER_DESC_blades_and_thrones_army_loyalty_display: "Reflects the army's current political allegiance to the state, the crown, and the soldier estate."
 AUTO_MODIFIER_NAME_blades_and_thrones_army_loyal_effect: "High Army Loyalty"
 AUTO_MODIFIER_DESC_blades_and_thrones_army_loyal_effect: "A loyal army helps the crown maintain order and reduces soldier unrest."
 AUTO_MODIFIER_NAME_blades_and_thrones_army_disloyal_effect: "Collapsing Army Loyalty"
 AUTO_MODIFIER_DESC_blades_and_thrones_army_disloyal_effect: "A disloyal army weakens royal authority and raises the risk of soldier rebellion and coup."
 MODIFIER_TYPE_NAME_zzz_rebalanced_nepal_mercenary_soldiers_estate_target_satisfaction: "Soldier Estate Satisfaction Equilibrium"
 MODIFIER_TYPE_NAME_global_zzz_rebalanced_nepal_mercenary_soldiers_army_loyalty: "Current Army Loyalty"
 MODIFIER_TYPE_DESC_global_zzz_rebalanced_nepal_mercenary_soldiers_army_loyalty: "Affected by soldier estate satisfaction, soldier estate power, crown power, army and fort maintenance sliders, the Royal Hand, mercenary pressure, stability, war exhaustion, war state, and military doctrine."
 MODIFIER_TYPE_NAME_monthly_zzz_rebalanced_nepal_mercenary_soldiers_pay: "Current Monthly Army Pay"
 MODIFIER_TYPE_DESC_monthly_zzz_rebalanced_nepal_mercenary_soldiers_pay: "The fixed pay the treasury transfers to the soldier estate this month - 5 gold per 1,000 regulars plus 1 gold per fort, every month. It is unrelated to maintenance."
 MODIFIER_TYPE_DESC_zzz_rebalanced_nepal_mercenary_soldiers_estate_target_satisfaction: "This impacts the [estate_satisfaction_equilibrium|e] of the $zzz_rebalanced_nepal_mercenary_soldiers_estate$ in this [country|e]."
 AUTO_MODIFIER_NAME_zzz_rebalanced_nepal_mercenary_soldiers_estate_mercenary_pressure: "Mercenary Strength Pressure"
 AUTO_MODIFIER_DESC_zzz_rebalanced_nepal_mercenary_soldiers_estate_mercenary_pressure: "The stronger hired mercenaries are relative to the country's effective loyal military, the lower the soldier estate's satisfaction equilibrium."
 AUTO_MODIFIER_NAME_zzz_blades_and_thrones_soldiers_base_satisfaction: "Soldier Estate Base Satisfaction"
 AUTO_MODIFIER_DESC_zzz_blades_and_thrones_soldiers_base_satisfaction: "Provides the country base value for the soldier estate's satisfaction equilibrium."
 mercenary_mutiny_exiles_name: "Exile Mercenary Company"
 mercenary_mutiny_exiles_name_ADJ: "Exile Mercenary"
 mercenary_mutiny_annex_exiles_name: "The Exiles"
 mercenary_mutiny_annex_exiles_name_ADJ: "Exile"
 mercenary_mutiny_exiles_reform: "Army in Exile"
 mercenary_mutiny_exiles_reform_desc: "A community of war that has lost its lands yet remains an army - sustained by mercenary contracts, foreign outposts and the spoils of war, waiting by alien campfires for its fate: restoration, settlement, or a throne of its own. Exiles and mercenary companies alike belong to this order."
 mercenary_mutiny_manpower_pool: "Company Manpower Pool"
 mercenary_mutiny_manpower_pool_desc: "A foreign recruitment post that employs local soldiers and provides the owner with 5 manpower every month."
 mercenary_mutiny_manpower_pool_unlock_tt: "Allows the Company Manpower Pool foreign building"
 mercenary_mutiny_contract_hall: "Company Contract Hall"
 mercenary_mutiny_contract_hall_desc: "A contract hall in a foreign town where employers sign hire agreements. Each hall brings 1 gold of contract commissions per month to its owner, plus a small amount of trade capacity; one per location - build one in each town."
 mercenary_mutiny_state: "Mercenary State"
 mercenary_mutiny_state_adj: "Mercenary"
 mercenary_mutiny_army_country_subsidy: "Mercenary Company Subsidy"
 mercenary_mutiny_army_country_subsidy_desc: "Monthly subsidy to keep the territory-free mercenary country funded."
 mercenary_mutiny_test.1.title: "Blades and Thrones"
 mercenary_mutiny_test.1.desc: "Debug menu for the mercenary, standing army, and state politics systems."
 mercenary_mutiny_test.1.a: "Show debug values"
 mercenary_mutiny_test.1.b: "Create mutiny rebels"
 mercenary_mutiny_test.1.c: "Force rebel victory"
 mercenary_mutiny_test.1.d: "Simulate takeover"
 mercenary_mutiny_test.1.e: "Close"
 mercenary_mutiny_test.1.f: "Create army country and transfer mercenaries"
 mercenary_mutiny_test.1.b.tt: "Creates a mercenary mutiny rebel and sets its starting progress."
 mercenary_mutiny_test.1.c.tt: "Forces the current mercenary mutiny rebel to victory and starts the civil war immediately."
 mercenary_mutiny_test.1.d.tt: "Directly simulates the takeover: rename, new ruler, disband mercenaries, and add soldier POPs."
 mercenary_mutiny_test.1.f.tt: "Creates a territory-free mercenary company country as a disloyal subject, and transfers all hired mercenaries to it."
 mercenary_mutiny_test.2.title: "The State Falls"
 mercenary_mutiny_test.2.desc: "Your country is about to be annexed, but its remaining regular army or hired mercenaries have formed a territory-free company known as 'The Exiles'. You may accept defeat, or take command of this army and continue the fight."
 mercenary_mutiny_test.2.a: "Take command of the army"
 mercenary_mutiny_test.2.b: "Accept defeat"
 mercenary_mutiny_test.3.title: "Annex Conversion Test"
 mercenary_mutiny_test.3.desc: "Debug event: simulates a country being annexed and its remnants becoming an exile company. Two ways to use it - \n· Fire it on an AI annexer (event mercenary_mutiny_test.3 <AI TAG>): the AI randomly picks a human player as the annexation target, converts them and opens the 'Fall of the Nation' choice event (the trigger country itself is never picked).\n· Fire it on yourself (event mercenary_mutiny_test.3): pick 'Convert and switch player directly' to treat yourself as the annexation target, convert and switch play (skips 'Fall of the Nation')."
 mercenary_mutiny_test.3.a: "Convert and transfer"
 mercenary_mutiny_test.3.a.tt: "Creates the army country, transfers units, then opens the annexation choice event on the human target."
 mercenary_mutiny_test.3.b: "Convert and switch player directly"
 mercenary_mutiny_test.3.b.tt: "Treat yourself as the annexed country: run the conversion, your remnants become an exile company ('Exiled ××'), and switch play to that company immediately."
 mercenary_mutiny_test.4.title: "The Company Takes the Crown"
 mercenary_mutiny_test.4.desc: "The mercenary company has overwhelmed the state and seized control. The remnants of the old realm continue as 'The Exiles', a territory-free army."
 mercenary_mutiny_test.4.b.tt: "Abandon the mercenary state and take command of 'The Exiles', the remnant army of the old realm, to continue the fight in exile."
 mercenary_mutiny_test.4.a: "Continue"
 mercenary_mutiny_test.5.title: "The Company Goes Its Own Way"
 mercenary_mutiny_test.5.desc: "Neither side could destroy the other. The mercenary company has left the country and set up on its own: nominally a subject, in practice an army that answers to no one."
 mercenary_mutiny_test.5.a: "Continue"
 mercenary_mutiny_test.5.b.tt: "Abandon your current country and take command of the mercenary company. It is still nominally your disloyal subject; you decide whether to remain in vassalage or carve out your own independence."
 mercenary_mutiny_test.6.title: "The Mercenaries Are Destroyed"
 mercenary_mutiny_test.6.desc: "The rebellion has been crushed and the hired company has ceased to exist."
 mercenary_mutiny_test.6.a: "Continue"
 mercenary_mutiny_test.7.title: "A Night of Mutiny"
 mercenary_mutiny_test.7.historical_info: "Mercenaries are a double-edged sword: in peace they drain the treasury, in war they decide the outcome, and when the state grows weak - they remember the swords in their hands. From Carthage to the condottieri of the Renaissance, history proves again and again: outsource your army to gold, and be prepared for gold to take over your state."
 mercenary_mutiny_test.7.desc: "Strange torches burn on the walls of the border garrison. The company captains have barred the gates and are reading out a list in the square - arrears of pay, withheld loot, and new titles carved for themselves. Merchants pack their goods; hooves pound the road all night.\n\nThe hired companies no longer answer to the crown. They hold their garrison and demand the old accounts be settled - or, as they put it, the crown's debt be paid."
 mercenary_mutiny_test.7.a: "Crush them now"
 mercenary_mutiny_test.7.b: "Pay them to stand down"
 mercenary_mutiny_test.7.c: "Let them run wild"
 mercenary_mutiny_test.8.title: "The Fire Spreads"
 mercenary_mutiny_test.8.desc: "Seditious pamphlets hang from the trees around the rebel camp, each word harsher than the last. Scouts report siege engines under construction and banners bearing unfamiliar arms. Every day the price of negotiation rises; every day their patience thins."
 mercenary_mutiny_test.8.a: "Pay a heavy ransom"
 mercenary_mutiny_test.8.b: "Launch a costly assault"
 mercenary_mutiny_test.8.c: "Allow them to loot"
 mercenary_mutiny_test.9.title: "Soldier Mutiny"
 mercenary_mutiny_test.9.desc: "The soldier estate in the royal hand is drifting toward the rebels. They demand better pay, or the crown must surrender more power."
 mercenary_mutiny_test.9.a: "Crush the mutiny"
 mercenary_mutiny_test.9.b: "Pay them off"
 mercenary_mutiny_test.9.c: "Let them take charge"
 mercenary_mutiny_test.10.title: "The Mercenary Company Demands Payment"
 mercenary_mutiny_test.10.desc: "The mercenary company that broke away from royal control now camps within your borders. They are nominally your subject, yet refuse every order - no tribute, no levies, and they may even turn on you when a foreign foe comes knocking.\n\nTheir captain now sends an insolent letter, sealed with the company's own arms: pay a fortune to buy five more years of their nominal loyalty, or watch them tear up the treaty of vassalage and set up on their own. In the taverns they are already saying: 'Those mercenaries claim they are only collecting what is owed.'"
 mercenary_mutiny_test.10.a.tt: "Pay [ROOT.GetVariable('blades_and_thrones_company_demand_display').GetValue|V0] gold. The mercenary company will stay quiet for five years. Military crisis -10."
 mercenary_mutiny_test.10.b.tt: "They will remember this insult (refusals: [Root.GetVariable('mercenary_mutiny_company_refusals').GetValue|V0]/2). Refuse twice, and the company will renounce its vassalage and declare full independence (military crisis +5)."
 mercenary_mutiny_test.11.title: "The Mercenary Company Declares Independence"
 mercenary_mutiny_test.11.desc: "The mercenary company has torn up its treaty of vassalage and set up on its own, in plain sight. They answer to no one now - only to gold.\nThe military crisis deepens, and the precedent of a company going independent stirs the whole mercenary market."
 mercenary_mutiny_test.11.a.tt: "Abandon your current country and leave with the mercenary company, becoming a fully independent territory-free mercenary army."
 mercenary_mutiny_test.12.title: "The Mercenary Company Goes Independent"
 mercenary_mutiny_test.12.desc: "The mercenary company has torn up its treaty of vassalage and become a fully independent territory-free army, camped at the edge of your former lands. Their campfires line the border, and scouts report new banners in the camp - yours no longer among them.\n\nIf you wish, you may set down the crown and take up their banner."
 mercenary_mutiny_test.12.a.tt: "Abandon your current country and take command of the independent mercenary company."
 STATIC_MODIFIER_NAME_mercenary_mutiny_takeover_aftermath: "Mercenary Takeover Aftermath"
 STATIC_MODIFIER_DESC_mercenary_mutiny_takeover_aftermath: "The state now rests on the loyalty of hired blades."
 STATIC_MODIFIER_NAME_mercenary_mutiny_split_aftermath: "Mercenary Split Aftermath"
 STATIC_MODIFIER_DESC_mercenary_mutiny_split_aftermath: "The realm survives, but its reputation with mercenary companies is damaged."
 STATIC_MODIFIER_NAME_mercenary_mutiny_crushed_aftermath: "Mercenary Revolt Crushed"
 STATIC_MODIFIER_DESC_mercenary_mutiny_crushed_aftermath: "The state has proven it cannot be bought, but the hired companies will remember."
 STATIC_MODIFIER_NAME_mercenary_mutiny_disloyal_subject: "Disloyal Mercenary Company"
 STATIC_MODIFIER_DESC_mercenary_mutiny_disloyal_subject: "The mercenary company refuses the overlord's commands, pays no tribute, answers no call to arms, and bides its time to break free."
 STATIC_MODIFIER_NAME_mercenary_mutiny_placated: "Placated Mercenary Company"
 STATIC_MODIFIER_DESC_mercenary_mutiny_placated: "A fortune in gold has quieted the mercenary company for now. They serve only money, and this will not last."
 mercenary_mutiny_debug_tt: "Mercenary companies: [ROOT.GetVariable('mercenary_mutiny_debug_company_count').GetValue|V0]\nMercenary sub-units: [ROOT.GetVariable('mercenary_mutiny_debug_subunit_count').GetValue|V0]\nMercenary total strength: [ROOT.GetVariable('mercenary_mutiny_debug_total_strength').GetValue|V2]\nTotal population: [ROOT.GetVariable('mercenary_mutiny_debug_total_population').GetValue|V2]"


